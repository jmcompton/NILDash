<script>
/* NILDash demo analytics. Sends anonymous events to /api/demo/event
   (server/services/demoEvents.js). Nothing personal is sent: a random id per
   visit, the event, the screen, and on the first event where the visitor came
   from. It never blocks or breaks the page: every call is fire-and-forget,
   and every line is inside a try. Paste this whole block at the very end of
   public/demo.html, after the page's own script. */
(function () {
  try {
    var ENDPOINT = '/api/demo/event';
    var sid = null;
    try { sid = sessionStorage.getItem('nd_demo_sid'); } catch (e) {}
    if (!sid) {
      sid = (window.crypto && crypto.randomUUID ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))
        .replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      try { sessionStorage.setItem('nd_demo_sid', sid); } catch (e) {}
    }
    var screen = 'home';
    var started = Date.now();

    function send(event, extra) {
      try {
        var body = { session_id: sid, event: event, screen: screen };
        if (extra) for (var k in extra) body[k] = extra[k];
        var data = JSON.stringify(body);
        if (navigator.sendBeacon && navigator.sendBeacon(ENDPOINT, new Blob([data], { type: 'application/json' }))) return;
        fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: data, keepalive: true })
          .catch(function () {});
      } catch (e) {}
    }

    // Where they came from: the page knows, the server cannot.
    var utm = '';
    try { utm = new URLSearchParams(location.search).get('utm_source') || ''; } catch (e) {}
    send('view', { ref: document.referrer || '', utm: utm });

    // Capture phase, so this sees every click before the page's own handler
    // and never depends on it.
    document.addEventListener('click', function (e) {
      try {
        var t = e.target && e.target.closest && e.target.closest(
          '[data-goto],[data-do],[data-dsdo],[data-open],#runScan,#approveAll,#reset,a[href*="calendly.com"]');
        if (!t) return;
        if (t.matches('a[href*="calendly.com"]')) { send('book_call'); return; }
        if (t.id === 'runScan') { send('deal_scan'); return; }
        if (t.id === 'approveAll') { send('pitch_approve'); return; }
        if (t.id === 'reset') { screen = 'home'; send('screen'); return; }
        if (t.dataset.goto) { screen = t.dataset.goto; send('screen'); return; }
        if (t.dataset.do === 'sent' || t.dataset.dsdo === 'send') { send('pitch_approve'); return; }
        if (t.dataset.dsdo === 'ai' || t.dataset.dsdo === 'write' || t.dataset.open !== undefined) { send('pitch_open'); return; }
      } catch (err) {}
    }, true);

    // Time on page: a heartbeat every 30s while the tab is visible, for up to
    // 30 minutes, and 'leave' when it is hidden or closed.
    var beats = setInterval(function () {
      try {
        if (Date.now() - started > 30 * 60 * 1000) { clearInterval(beats); return; }
        if (document.visibilityState === 'visible') send('heartbeat');
      } catch (e) {}
    }, 30000);
    document.addEventListener('visibilitychange', function () {
      try { if (document.visibilityState === 'hidden') send('leave'); } catch (e) {}
    });
  } catch (e) {}
})();
</script>
