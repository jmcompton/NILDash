<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NILDash for Athletics Departments</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="NILDash">
<meta property="og:url" content="https://mynildash.com/athletics">
<meta property="og:title" content="NILDash for athletics departments">
<meta property="og:description" content="Thirteen teams, every local business around campus, and the sponsorship ask already written. Click through it. No login.">
<meta property="og:image" content="https://mynildash.com/demo-preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NILDash for athletics departments">
<meta name="twitter:description" content="Thirteen teams, every local business around campus, and the sponsorship ask already written. Click through it. No login.">
<meta name="twitter:image" content="https://mynildash.com/demo-preview.png">
<meta name="description" content="An interactive demo of the NILDash university product: team sponsorship inventory, nightly local business discovery, and one click approval for athletics departments.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#080C14; --panel:#0C111B; --card:#111823; --sunk:#0C121C;
  --line:#1E2735; --line-2:#2E3D55; --line-3:#222D3F;
  --lime:#A3E635; --lime-dim:#7FA82A;
  --text:#EDF1F7; --muted:#98A2B3; --dim:#7A8496; --dimmer:#6B7688;
  --blue:#8FB6FF; --blue-line:#3A557F;
  --green:#A9D77E; --green-line:#44603A;
  --amber:#E8B86B; --amber-line:#6B5330;
  --violet:#C08BF5; --violet-line:#5A4275;
  --sent-fill:#121E14; --sent-line:#2E4A2E;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
h1,h2,h3{text-wrap:balance}
input,select{font:inherit}

body{padding-bottom:62px}
.ribbon{position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 20px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));
  background:#151B12;border-top:1px solid #2A3520;
  font-family:var(--mono);font-size:12px;color:#C9DFA0;
  box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.ribbon b{color:var(--lime);font-weight:500}
.ribbon .spacer{flex:1 1 auto}
.ribbon button{font-family:var(--mono);font-size:11px;color:#C9DFA0;border:1px solid #2A3520;border-radius:6px;padding:4px 10px}
.ribbon button:hover{border-color:var(--lime-dim);color:var(--lime)}
.ribbon .book{display:inline-flex;align-items:center;padding:5px 14px;border-radius:7px;
  background:var(--lime);color:#0A0F17;font-family:var(--body);font-size:12.5px;font-weight:600;
  text-decoration:none;white-space:nowrap}
.ribbon .book:hover{filter:brightness(1.08)}

.shell{display:flex;min-width:0;max-width:100%;min-height:100%}
nav.side{width:206px;flex:0 0 206px;padding:22px 14px 18px;background:var(--panel);border-right:1px solid #1B2433;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--lime);color:#0A0F17;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px}
.brand .word{font-family:var(--mono);font-size:14px;line-height:1.15;color:var(--lime)}
.eyebrow{padding:0 4px;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;color:var(--dimmer)}
.navlist{display:flex;flex-direction:column;gap:1px}
.navlist button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--muted);text-align:left;border:1px solid transparent}
.navlist button i{width:5px;height:5px;border-radius:50%;background:#39445A;flex:0 0 auto}
.navlist button:hover{color:var(--text);background:#121A26}
.navlist button.on{background:#16202F;border-color:#263248;color:var(--lime)}
.navlist button.on i{background:var(--lime)}
.navlist button.vio{color:var(--violet)}
.navlist button.vio i{background:#7A5A9E}
.navlist .pill{margin-left:auto;padding:1px 7px;border-radius:999px;background:var(--lime);color:#0A0F17;font-size:11px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid #1B2433}
.who .av{width:32px;height:32px;border-radius:50%;background:#16202F;border:1px solid var(--lime);color:var(--lime);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.who .nm{display:flex;flex-direction:column;min-width:0}
.who .nm b{font-size:13px;font-weight:500}
.who .nm small{font-size:11px;color:var(--dim)}

main.stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.crumb{padding:15px 30px;border-bottom:1px solid #141C28;display:flex;align-items:center;gap:18px}
.crumb .path{font-family:var(--mono);font-size:13px;color:var(--dim)}
.crumb .path b{color:var(--text);font-weight:400}
.crumb .grow{flex:1 1 auto}
.crumb .search{width:210px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-3);background:#0E1520;color:var(--dimmer);font-family:var(--mono);font-size:13px;display:flex;align-items:center}
.crumb .ready{display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--lime)}
.crumb .ready i{width:6px;height:6px;border-radius:50%;background:var(--lime)}

.board{padding:20px 30px 28px;display:flex;flex-direction:column;gap:16px;flex:1 1 auto}
.head h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.7px}
.head p{margin:4px 0 0;font-size:15px;color:var(--muted);max-width:78ch}
.toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolrow .grow{flex:1 1 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 20px;border-radius:9px;font-size:14px;white-space:nowrap;transition:filter .15s,border-color .15s,color .15s}
.btn.go{background:var(--lime);color:#0A0F17;font-weight:600}
.btn.go:hover{filter:brightness(1.08)}
.btn.ghost{border:1px solid #2B3648;color:var(--muted);padding:0 17px}
.btn.ghost:hover{border-color:#3E4C64;color:var(--text)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.xs{height:30px;padding:0 11px;font-size:12.5px;border-radius:7px}
.help{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center}

.sel{height:38px;padding:0 11px;border-radius:8px;border:1px solid var(--line-3);background:#0E1520;color:var(--text);font-size:13.5px}
.inp{height:42px;padding:0 13px;border-radius:9px;border:1px solid var(--line-3);background:#0E1520;color:var(--text);font-size:14px;width:100%}
.inp:focus,.sel:focus{outline:2px solid var(--lime-dim);outline-offset:1px;border-color:transparent}
.inp::placeholder{color:var(--dimmer)}

/* kpis */
.kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;gap:3px}
.kpi-label{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dimmer)}
.kpi-val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi-val.lime{color:var(--lime)}
.kpi-note{font-size:12.5px;color:var(--dim)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px 21px}
.panel h3{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:700}
.panel p.lede{margin:0;color:var(--muted);font-size:14px;max-width:76ch}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.4px;white-space:nowrap}
.chip.grey{border:1px solid #2B3648;color:var(--dim)}
.chip.blue{border:1px solid var(--blue-line);color:var(--blue)}
.chip.amber{border:1px solid var(--amber-line);color:var(--amber)}
.chip.green{border:1px solid var(--sent-line);color:var(--green);background:#0F1A11}
.chip.lime{border:1px solid var(--lime-dim);color:var(--lime)}
.chip.violet{border:1px solid var(--violet-line);color:var(--violet)}

/* ---- Home cards ---- */
.tabs{padding:16px 30px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:8px;padding:10px 16px;white-space:nowrap;border-radius:10px 10px 0 0;color:var(--muted);font-size:15px;border:1px solid transparent;border-bottom:none}
.tabs button .n{padding:1px 7px;border-radius:999px;background:#1C2637;color:var(--muted);font-size:11px}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--card);border-color:var(--line-2);color:var(--text);font-weight:600}
.tabs button.on .n{background:var(--lime);color:#0A0F17;font-weight:600}
.tabs button.done .n{background:var(--sent-fill);color:var(--green);border:1px solid var(--sent-line)}
.tabrule{border-top:1px solid var(--line-2);margin:0 0 -1px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{background:var(--card);border:1px solid var(--line);border-radius:13px;transition:border-color .15s,opacity .2s}
.row.open{border-color:var(--line-2)}
.row.sent{background:var(--sent-fill);border-color:var(--sent-line)}
.row.skipped{opacity:.42}
.rowtop{display:flex;align-items:center;gap:13px;min-height:66px;padding:12px 16px 12px 20px}
.rowhit{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:13px;text-align:left;padding:0}
.rowhit:hover .biz{color:var(--lime)}
.rowhit:disabled{cursor:default}
.rowhit:disabled:hover .biz{color:var(--text)}
.chev{flex:0 0 auto;transition:transform .18s}
.row.open .chev{transform:rotate(90deg)}
.meta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.biz{font-size:18px;font-weight:600;transition:color .15s}
.sub{font-size:14px;color:var(--muted)}
.tag{flex:0 0 auto;padding:3px 9px;border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:.5px;white-space:nowrap}
.tag.email{border:1px solid var(--green-line);color:var(--green)}
.tag.dm{border:1px solid var(--blue-line);color:var(--blue)}
.tag.call{border:1px solid var(--amber-line);color:var(--amber)}
.tag.state{border:1px solid var(--sent-line);color:var(--green);background:#0F1A11}
.tag.state.off{border-color:#2B3648;color:var(--dim);background:none}
.acts{flex:0 0 auto;display:flex;gap:10px}
.body{padding:0 16px 16px 20px;display:flex;flex-direction:column;gap:11px}
.pitch{padding:16px 18px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1.58;color:#D6DEE9;white-space:pre-wrap}
.pitch .subj{display:block;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.pitch .subj b{color:var(--text);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:11px}
.tool{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:9px;border:1px solid #2B3648;color:#D6DEE9;font-size:14px}
.tool.alt{border-color:var(--blue-line);color:var(--blue)}
.tool.amber{border-color:var(--amber-line);color:var(--amber)}
.tool:hover{filter:brightness(1.25)}

/* ---- Deal Scan ---- */
.ds-lane-tabs{display:flex;gap:8px;flex-wrap:wrap}
.ds-lane-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.ds-lane-tab:hover{border-color:var(--line-2);color:var(--text)}
.ds-lane-tab.active{background:#16202F;border-color:var(--lime-dim);color:var(--lime);font-weight:600}
.ds-tab-count{padding:1px 8px;border-radius:999px;background:#1C2637;color:var(--muted);font-family:var(--mono);font-size:11px}
.ds-lane-tab.active .ds-tab-count{background:var(--lime);color:#0A0F17}
.ds-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 19px;display:flex;flex-direction:column;gap:13px}
.ds-card.best{border-color:var(--lime-dim)}
.ds-top{display:flex;gap:16px;align-items:flex-start}
.ds-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:11px}
.ds-titleline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ds-name{font-size:18px;font-weight:600}
.ds-lane-chip{padding:2px 8px;border-radius:6px;border:1px solid var(--line-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;color:var(--dim)}
.ds-lane-chip.best{border-color:var(--lime-dim);color:var(--lime)}
.ds-why{font-size:14px;color:var(--muted);line-height:1.55;max-width:80ch}
.ds-idea{font-size:14.5px}
.ds-idea b{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dimmer);font-weight:400;margin-right:8px}
.ds-pw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:baseline}
.ds-pw dt{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dimmer)}
.ds-pw dd{margin:0;color:#D6DEE9}
.ds-contacts{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.ds-contacts h4{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--dimmer);font-weight:400}
.ds-person{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:14px}
.ds-person b{font-weight:600}
.ds-person .r{color:var(--muted)}
.ds-person .c{font-family:var(--mono);font-size:12.5px;color:var(--green)}
.ds-person .src{font-family:var(--mono);font-size:11px;color:var(--dimmer);text-decoration:underline}
.ds-approach{font-size:14px;color:#D6DEE9}
.ds-approach b{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dimmer);font-weight:400;margin-right:6px}
.ds-fit{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 14px;border:1px solid var(--line-2);border-radius:11px;min-width:78px}
.ds-fit .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--lime);line-height:1}
.ds-fit .l{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:var(--dimmer)}
.ds-fit .q{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-decoration:underline;margin-top:4px}
.ds-actions{display:flex;gap:9px;flex-wrap:wrap;border-top:1px solid #161E2A;margin-top:2px;padding-top:13px}
.ds-card.done{border-color:var(--sent-line)}
.ds-fit .q{background:none;border:none;padding:0;cursor:pointer}
.ds-draft{display:flex;flex-direction:column;gap:11px;padding-top:3px}
.ds-drafting{padding:15px 17px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;
  font-family:var(--mono);font-size:13px;color:var(--lime)}
.ds-drafting:after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;
  background:var(--lime);animation:blink 1s steps(2,start) infinite;vertical-align:middle}
@keyframes blink{to{visibility:hidden}}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;
  max-width:min(92vw,520px);padding:12px 18px;border-radius:11px;
  background:#16202F;border:1px solid var(--lime-dim);color:var(--text);
  font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
th{text-align:left;padding:12px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dimmer);border-bottom:1px solid var(--line);font-weight:400;white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid #161E2A;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#131C28}
td .b{font-weight:600}
td .s{color:var(--dim);font-size:13px}
.pager{display:flex;align-items:center;gap:12px;justify-content:flex-end;font-size:13px;color:var(--dim)}

/* ---- pipeline board ---- */
.kan{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.kancol{background:#0D1420;border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:10px;min-width:215px}
.kanhead{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dimmer)}
.kanhead b{padding:1px 7px;border-radius:999px;background:#1C2637;color:var(--muted);font-size:11px;font-weight:400}
.kancard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:5px}
.kancard .t{font-weight:600;font-size:15px;line-height:1.3}
.kancard .m{font-size:13px;color:var(--dim)}
.kancard .v{font-family:var(--mono);font-size:12px;color:var(--lime)}

/* ---- roster ---- */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px;display:flex;flex-direction:column;gap:13px}
.rtop{display:flex;align-items:center;gap:13px}
.rav{width:50px;height:50px;border-radius:50%;background:#16202F;border:1px solid var(--lime);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;font-weight:700;flex:0 0 auto}
.rname{min-width:0}
.rname b{display:block;font-family:var(--display);font-size:19px;font-weight:700}
.rname span{display:block;font-size:13.5px;color:var(--muted)}
.rstat{font-size:13.5px;color:var(--dim);line-height:1.5}
.rnums{display:flex;gap:9px;flex-wrap:wrap}
.rnum{padding:5px 11px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:#D6DEE9}
.rbtns{display:flex;gap:7px;flex-wrap:wrap}

/* ---- media kit ---- */
.kit{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--card)}
.kithero{position:relative;min-height:170px;background:linear-gradient(135deg,#16202F 0%,#0E1A14 55%,#1A2410 100%);display:flex;align-items:flex-end;padding:20px 22px;gap:17px}
.kithero:after{content:"ACTION SHOT · BECOMES BANNER";position:absolute;top:13px;right:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;color:#3E4C64}
.kitav{width:88px;height:88px;border-radius:50%;background:#0C121C;border:2px solid var(--lime);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:29px;font-weight:700;flex:0 0 auto}
.kitname h2{margin:0;font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.6px}
.kitname p{margin:2px 0 0;color:var(--muted);font-size:14px}
.kitbody{padding:20px 22px;display:flex;flex-direction:column;gap:19px}
.kitrow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.kitnum{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kitnum .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.1px;color:var(--dimmer)}
.kitnum .v{font-family:var(--display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.kitsec h4{margin:0 0 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--dimmer);font-weight:400}

/* ===================== the ask writer ===================== */
function askDraft(teamId, bizId, ask){
  const b = BIZI[bizId], t = teamId === "all" ? null : TEAMI[teamId];
  const first = b.owner ? b.owner.split(" ")[0].replace(/^Dr\.$/, "Dr. " + b.owner.split(" ")[1]) : null;
  const greet = b.owner ? (b.owner.startsWith("Dr.") ? b.owner : first) : "there";
  const [item, price] = ask;

  const where = t
    ? `${t.name} plays ${t.dates} home ${t.dates === 1 ? "date" : "dates"} at ${t.venue.replace("Cypress College ","")}${t.crowd !== "n/a" ? `, with ${t.crowd} people there on a normal one` : ""}.`
    : `Cypress College Athletics runs 13 teams across three seasons, with more than 130 home dates a year between them.`;

  const body =
`Hi ${greet},

I'm writing from Cypress College Athletics, about a mile from you on Valley View.

${where}

We're setting sponsors for the ${t ? t.season.toLowerCase() : "coming"} season and ${b.n} came up because you're ${b.mi <= 1 ? "practically on campus" : `${b.mi} miles out`} and your customers are already the people in those seats.

The ask is simple. ${item} runs ${money(price)}${t && price >= 1000 ? " for the full season" : ""}. That money goes straight to the program, not to any student athlete, so there's no paperwork on your end beyond an invoice.

If it's easier to talk in person I can come to you this week.

Cypress College Athletics
Cypress, CA`;

  return { subj: `${t ? t.name : "Cypress College Athletics"} sponsorship`, body };
}

/* ===================== SPONSOR SCAN ===================== */
function lanesFor(teamId){
  if (SCAN[teamId]) return SCAN[teamId];
  const t = TEAMI[teamId], out = {};
  const menu = teamAssets(t);
  Object.keys(GENERIC_LANES).forEach((lane, li) => {
    out[lane] = GENERIC_LANES[lane].map((bid, i) => {
      const b = BIZI[bid];
      const ask = lane === "Bigger asks"
        ? (DEPT_ASSETS[i % DEPT_ASSETS.length])
        : menu[Math.min(i, menu.length - 1)];
      return {
        b: bid, fit: 92 - li * 4 - i * 3, best: i === 0,
        ask,
        why:`${b.note} ${b.mi} miles from campus, ${b.rate} stars across ${b.rc} reviews.`,
        idea:`${ask[0]} for ${t.name.toLowerCase()}, across ${t.dates} home ${t.dates===1?"date":"dates"} this ${t.season.toLowerCase()}.`,
        approach:`${b.role} decides. ${b.phone ? "Published number on the listing." : "No published direct line, run the finder first."}`
      };
    });
  });
  return out;
}

/* ===================== router ===================== */
const VIEWS = { home:vHome, scan:vScan, teams:vTeams, inventory:vInventory, sponsors:vSponsors,
  outreach:vOutreach, pipeline:vPipeline, calendar:vCalendar, reports:vReports,
  command:vCommand, compliance:vCompliance, settings:vSettings };

function paint(){
  $("view").innerHTML = (VIEWS[view] || vHome)();
  paintNav();
  window.scrollTo({ top:0 });
}
function go(v){ view = v; paint() }

/* ===================== events ===================== */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-goto],[data-card],[data-approve],[data-skip],[data-season],[data-lane],[data-sdo],[data-inv],[data-cat],[data-ask],[data-do],#approveAll,#runScan,#reset");
  if (!t) return;

  if (t.dataset.goto !== undefined){ e.preventDefault(); go(t.dataset.goto); return }

  if (t.dataset.card !== undefined){
    const i = +t.dataset.card, s = cs(i);
    s.open = !s.open; paint(); return;
  }
  if (t.dataset.approve !== undefined){
    const i = +t.dataset.approve; cs(i).approved = true; cs(i).open = false;
    toast("Approved. It goes out from your own address."); paint(); return;
  }
  if (t.dataset.skip !== undefined){
    const i = +t.dataset.skip; cs(i).skipped = true; cs(i).open = false;
    toast("Skipped. NILDash will not ask them again this season."); paint(); return;
  }
  if (t.id === "approveAll"){
    CARDS.forEach((c,i) => { if (!cs(i).skipped && (homeSeason === "All" || teamSeason(c.team) === homeSeason)) cs(i).approved = true });
    toast("All approved. That is the morning done."); paint(); return;
  }
  if (t.dataset.season !== undefined){ homeSeason = t.dataset.season; paint(); return }

  if (t.id === "runScan"){
    scanRun = true; scanLane = "Near campus";
    toast("Scanned " + BIZ.length + " businesses inside three miles."); paint(); return;
  }
  if (t.dataset.lane !== undefined){ scanLane = t.dataset.lane; paint(); return }

  if (t.dataset.sdo !== undefined){
    const [act, i] = t.dataset.sdo.split("|");
    const s = ss(scanTeam, scanLane, +i);
    if (act === "draft"){
      s.drafting = true; s.drafted = false; paint();
      setTimeout(() => { s.drafting = false; s.drafted = true; paint() }, 850);
    } else if (act === "queue"){
      s.queued = !s.queued;
      toast(s.queued ? "Queued. It shows on Home for approval." : "Taken out of the queue.");
      paint();
    } else if (act === "hold"){
      toast("Held. NILDash will bring them back next season.");
    } else if (act === "finder"){
      toast("Finder running. It checks the listing, the website and the state business record.");
    } else if (act === "why"){
      const r = (lanesFor(scanTeam)[scanLane]||[])[+i];
      toast("Fit " + r.fit + ": distance, category, review volume and season overlap.");
    }
    return;
  }

  if (t.dataset.inv !== undefined){ invFilter = t.dataset.inv; paint(); return }
  if (t.dataset.cat !== undefined){ sponsorFilter = t.dataset.cat; paint(); return }

  if (t.dataset.ask !== undefined){
    const q = t.dataset.ask;
    if (!aiAsked.includes(q)) aiAsked.push(q);
    paint(); return;
  }

  if (t.dataset.do !== undefined){
    const m = {
      edit:"Opens in your own email, where you can change anything before it sends.",
      another:"Rewriting with a different angle.",
      finder:"Finder running. Listing, website, then the state business record.",
      export:"In the real thing this downloads a spreadsheet."
    };
    toast(m[t.dataset.do] || "Demo only."); return;
  }

  if (t.id === "reset"){
    cardState = {}; scanState = {}; scanRun = false; aiAsked = [];
    homeSeason = "All"; invFilter = "All"; sponsorFilter = "All"; started = Date.now();
    go("home"); toast("Back to the start."); return;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "scanTeamSel"){ scanTeam = e.target.value; scanRun = false; paint() }
});

paint();
</script>
<script>
/* NILDash demo analytics. Anonymous events to /api/demo/event. No personal
   data: a random per-visit id, the event, the screen, and where the visit
   came from. Fire and forget, never blocks or breaks the page. */
(function () {
  try {
    var ENDPOINT = '/api/demo/event';
    var sid = null;
    try { sid = sessionStorage.getItem('nd_demo_sid'); } catch (e) {}
    if (!sid) {
      sid = (window.crypto && crypto.randomUUID ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))
        .replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      try { sessionStorage.setItem('nd_demo_sid', sid); } catch (e) {}
    }
    var screen = 'home';
    var started = Date.now();

    function send(event, extra) {
      try {
        var body = { session_id: sid, event: event, screen: screen };
        if (extra) for (var k in extra) body[k] = extra[k];
        var data = JSON.stringify(body);
        if (navigator.sendBeacon && navigator.sendBeacon(ENDPOINT, new Blob([data], { type: 'application/json' }))) return;
        fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: data, keepalive: true })
          .catch(function () {});
      } catch (e) {}
    }

    var utm = '';
    try { utm = new URLSearchParams(location.search).get('utm_source') || ''; } catch (e) {}
    send('view', { ref: document.referrer || '', utm: utm });

    document.addEventListener('click', function (e) {
      try {
        var t = e.target && e.target.closest && e.target.closest(
          '[data-goto],[data-do],[data-dsdo],[data-open],#runScan,#approveAll,#reset,a[href*="calendly.com"]');
        if (!t) return;
        if (t.matches('a[href*="calendly.com"]')) { send('book_call'); return; }
        if (t.id === 'runScan') { send('deal_scan'); return; }
        if (t.id === 'approveAll') { send('pitch_approve'); return; }
        if (t.id === 'reset') { screen = 'home'; send('screen'); return; }
        if (t.dataset.goto) { screen = t.dataset.goto; send('screen'); return; }
        if (t.dataset.do === 'sent' || t.dataset.dsdo === 'send') { send('pitch_approve'); return; }
        if (t.dataset.dsdo === 'ai' || t.dataset.dsdo === 'write' || t.dataset.open !== undefined) { send('pitch_open'); return; }
      } catch (err) {}
    }, true);

    var beats = setInterval(function () {
      try {
        if (Date.now() - started > 30 * 60 * 1000) { clearInterval(beats); return; }
        if (document.visibilityState === 'visible') send('heartbeat');
      } catch (e) {}
    }, 30000);
    document.addEventListener('visibilitychange', function () {
      try { if (document.visibilityState === 'hidden') send('leave'); } catch (e) {}
    });
  } catch (e) {}
})();
</script>
