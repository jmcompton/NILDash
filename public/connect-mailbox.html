<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect your email · NILDash</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#0A0A0A;color:#F0EDE6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:420px;background:#141414;border:1px solid rgba(240,237,230,0.08);border-radius:14px;padding:32px 24px}
.logo{text-align:center;margin-bottom:20px}
h1{font-size:20px;margin-bottom:10px}
p{font-size:14px;line-height:1.55;color:rgba(240,237,230,0.7);margin-bottom:22px}
a.btn{display:block;text-align:center;padding:14px 18px;border-radius:40px;font-weight:700;text-decoration:none;margin-bottom:12px;font-size:15px}
a.gmail{background:#C8F135;color:#000}
a.outlook{background:transparent;color:#F0EDE6;border:1px solid rgba(240,237,230,0.25)}
.small{font-size:12px;color:rgba(240,237,230,0.45);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="/images/nildash-logo-header.png" alt="NILDash" style="height:32px;width:auto;"></div>
  <h1>Connect your email</h1>
  <p>Your pitches go out from your own inbox, so replies come straight to you. Pick the one you use for work. It takes a minute.</p>
  <a class="btn gmail" href="/reconnect-mailbox?provider=gmail&back=setup">Connect Gmail</a>
  <a class="btn outlook" href="/reconnect-mailbox?provider=outlook&back=setup">Connect Outlook</a>
  <div class="small">You'll sign in to NILDash first if you aren't already. We only send what you approve.</div>
</div>
</body>
</html>
