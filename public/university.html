<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NILDash University Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/images/nildash-icon-120x120.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--
  THE UNIVERSITY PORTAL, served at /university (server/index.js).
  The CSS block below is copied verbatim from public/athletics.html, the
  signed-off demo, and so is the page shell. tests/universityportal.js fails if
  the two drift. Only what the live page needs and the demo does not is added
  after it, in its own block: the sign-in screen and the sign-out link. The
  demo's bottom ribbon (Start over, Book a call) is demo-only and is left out.
-->
<style>
:root{
  --ink:#080C14; --panel:#0C111B; --card:#111823; --sunk:#0C121C;
  --line:#1E2735; --line-2:#2E3D55; --line-3:#222D3F;
  --lime:#A3E635; --lime-dim:#7FA82A;
  --text:#EDF1F7; --muted:#98A2B3; --dim:#7A8496; --dimmer:#6B7688;
  --blue:#8FB6FF; --blue-line:#3A557F;
  --green:#A9D77E; --green-line:#44603A;
  --amber:#E8B86B; --amber-line:#6B5330;
  --violet:#C08BF5; --violet-line:#5A4275;
  --sent-fill:#121E14; --sent-line:#2E4A2E;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
h1,h2,h3{text-wrap:balance}
input,select{font:inherit}

body{padding-bottom:62px}
.ribbon{position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 20px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));
  background:#151B12;border-top:1px solid #2A3520;
  font-family:var(--mono);font-size:12px;color:#C9DFA0;
  box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.ribbon b{color:var(--lime);font-weight:500}
.ribbon .spacer{flex:1 1 auto}
.ribbon button{font-family:var(--mono);font-size:11px;color:#C9DFA0;border:1px solid #2A3520;border-radius:6px;padding:4px 10px}
.ribbon button:hover{border-color:var(--lime-dim);color:var(--lime)}
.ribbon .book{display:inline-flex;align-items:center;padding:5px 14px;border-radius:7px;
  background:var(--lime);color:#0A0F17;font-family:var(--body);font-size:12.5px;font-weight:600;
  text-decoration:none;white-space:nowrap}
.ribbon .book:hover{filter:brightness(1.08)}

.shell{display:flex;min-width:0;max-width:100%;min-height:100%;min-height:100vh}
nav.side{width:206px;flex:0 0 206px;padding:22px 14px 18px;background:var(--panel);border-right:1px solid #1B2433;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--lime);color:#0A0F17;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px}
.brand .word{font-family:var(--mono);font-size:14px;line-height:1.15;color:var(--lime)}
.eyebrow{padding:0 4px;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;color:var(--dimmer)}
.navlist{display:flex;flex-direction:column;gap:1px}
.navlist button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--muted);text-align:left;border:1px solid transparent}
.navlist button i{width:5px;height:5px;border-radius:50%;background:#39445A;flex:0 0 auto}
.navlist button:hover{color:var(--text);background:#121A26}
.navlist button.on{background:#16202F;border-color:#263248;color:var(--lime)}
.navlist button.on i{background:var(--lime)}
.navlist button.vio{color:var(--violet)}
.navlist button.vio i{background:#7A5A9E}
.navlist .pill{margin-left:auto;padding:1px 7px;border-radius:999px;background:var(--lime);color:#0A0F17;font-size:11px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid #1B2433}
.who .av{width:32px;height:32px;border-radius:50%;background:#16202F;border:1px solid var(--lime);color:var(--lime);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.who .nm{display:flex;flex-direction:column;min-width:0}
.who .nm b{font-size:13px;font-weight:500}
.who .nm small{font-size:11px;color:var(--dim)}

main.stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.crumb{padding:15px 30px;border-bottom:1px solid #141C28;display:flex;align-items:center;gap:18px}
.crumb .path{font-family:var(--mono);font-size:13px;color:var(--dim)}
.crumb .path b{color:var(--text);font-weight:400}
.crumb .grow{flex:1 1 auto}
.crumb .search{width:210px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-3);background:#0E1520;color:var(--dimmer);font-family:var(--mono);font-size:13px;display:flex;align-items:center}
.crumb .ready{display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--lime)}
.crumb .ready i{width:6px;height:6px;border-radius:50%;background:var(--lime)}

.board{padding:20px 30px 28px;display:flex;flex-direction:column;gap:16px;flex:1 1 auto}
.head h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.7px}
.head p{margin:4px 0 0;font-size:15px;color:var(--muted);max-width:78ch}
.toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolrow .grow{flex:1 1 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 20px;border-radius:9px;font-size:14px;white-space:nowrap;transition:filter .15s,border-color .15s,color .15s}
.btn.go{background:var(--lime);color:#0A0F17;font-weight:600}
.btn.go:hover{filter:brightness(1.08)}
.btn.ghost{border:1px solid #2B3648;color:var(--muted);padding:0 17px}
.btn.ghost:hover{border-color:#3E4C64;color:var(--text)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.xs{height:30px;padding:0 11px;font-size:12.5px;border-radius:7px}
.help{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center}

.sel{height:38px;padding:0 11px;border-radius:8px;border:1px solid var(--line-3);background:#0E1520;color:var(--text);font-size:13.5px}
.inp{height:42px;padding:0 13px;border-radius:9px;border:1px solid var(--line-3);background:#0E1520;color:var(--text);font-size:14px;width:100%}
.inp:focus,.sel:focus{outline:2px solid var(--lime-dim);outline-offset:1px;border-color:transparent}
.inp::placeholder{color:var(--dimmer)}

/* kpis */
.kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;gap:3px}
.kpi-label{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dimmer)}
.kpi-val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi-val.lime{color:var(--lime)}
.kpi-note{font-size:12.5px;color:var(--dim)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px 21px}
.panel h3{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:700}
/* ── Today's leads and the sponsor list ── */
.lead{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:grid;gap:8px}
.lead .biz{font-family:var(--display);font-size:17px;font-weight:700}
.lead .who{font-size:13.5px;color:var(--text)}
.lead .who span{color:var(--muted)}
.lead ol.points{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.5}
.lead .dm2{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line,#2a2a2a)}
.lead .reach{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.lead .reach a{color:var(--lime);text-decoration:none}
.lead .why{font-size:13.5px;color:var(--muted);line-height:1.5}
.lead details{border-top:1px solid var(--line);padding-top:8px}
.lead summary{cursor:pointer;font-size:13px;color:var(--lime);font-weight:600}
.lead pre{white-space:pre-wrap;font:13.5px/1.55 var(--body);color:var(--text);margin:8px 0 0}
.leads{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.teamhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.teamhead h3{margin:0;font-family:var(--display);font-size:18px}
.teamhead span{color:var(--dim);font-size:13px}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:4px}
.howto div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);line-height:1.5}
.howto b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.sel{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line-3);background:#0E1520;color:var(--text);font-size:13px}
.inp.sm{height:34px;font-size:13px;width:220px}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto}
.modal pre{white-space:pre-wrap;font:14px/1.6 var(--body);color:var(--text)}
.panel p.lede{margin:0;color:var(--muted);font-size:14px;max-width:76ch}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.4px;white-space:nowrap}
.chip.grey{border:1px solid #2B3648;color:var(--dim)}
.chip.blue{border:1px solid var(--blue-line);color:var(--blue)}
.chip.amber{border:1px solid var(--amber-line);color:var(--amber)}
.chip.green{border:1px solid var(--sent-line);color:var(--green);background:#0F1A11}
.chip.lime{border:1px solid var(--lime-dim);color:var(--lime)}
.chip.violet{border:1px solid var(--violet-line);color:var(--violet)}

/* ---- Home cards ---- */
.tabs{padding:16px 30px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:8px;padding:10px 16px;white-space:nowrap;border-radius:10px 10px 0 0;color:var(--muted);font-size:15px;border:1px solid transparent;border-bottom:none}
.tabs button .n{padding:1px 7px;border-radius:999px;background:#1C2637;color:var(--muted);font-size:11px}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--card);border-color:var(--line-2);color:var(--text);font-weight:600}
.tabs button.on .n{background:var(--lime);color:#0A0F17;font-weight:600}
.tabs button.done .n{background:var(--sent-fill);color:var(--green);border:1px solid var(--sent-line)}
.tabrule{border-top:1px solid var(--line-2);margin:0 0 -1px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{background:var(--card);border:1px solid var(--line);border-radius:13px;transition:border-color .15s,opacity .2s}
.row.open{border-color:var(--line-2)}
.row.sent{background:var(--sent-fill);border-color:var(--sent-line)}
.row.skipped{opacity:.42}
.rowtop{display:flex;align-items:center;gap:13px;min-height:66px;padding:12px 16px 12px 20px}
.rowhit{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:13px;text-align:left;padding:0}
.rowhit:hover .biz{color:var(--lime)}
.rowhit:disabled{cursor:default}
.rowhit:disabled:hover .biz{color:var(--text)}
.chev{flex:0 0 auto;transition:transform .18s}
.row.open .chev{transform:rotate(90deg)}
.meta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.biz{font-size:18px;font-weight:600;transition:color .15s}
.sub{font-size:14px;color:var(--muted)}
.tag{flex:0 0 auto;padding:3px 9px;border-radius:6px;font-family:var(--mono);font-size:11px;letter-spacing:.5px;white-space:nowrap}
.tag.email{border:1px solid var(--green-line);color:var(--green)}
.tag.dm{border:1px solid var(--blue-line);color:var(--blue)}
.tag.call{border:1px solid var(--amber-line);color:var(--amber)}
.tag.state{border:1px solid var(--sent-line);color:var(--green);background:#0F1A11}
.tag.state.off{border-color:#2B3648;color:var(--dim);background:none}
.acts{flex:0 0 auto;display:flex;gap:10px}
.body{padding:0 16px 16px 20px;display:flex;flex-direction:column;gap:11px}
.pitch{padding:16px 18px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1.58;color:#D6DEE9;white-space:pre-wrap}
.pitch .subj{display:block;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.pitch .subj b{color:var(--text);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:11px}
.tool{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:9px;border:1px solid #2B3648;color:#D6DEE9;font-size:14px}
.tool.alt{border-color:var(--blue-line);color:var(--blue)}
.tool.amber{border-color:var(--amber-line);color:var(--amber)}
.tool:hover{filter:brightness(1.25)}

/* ---- Deal Scan ---- */
.ds-lane-tabs{display:flex;gap:8px;flex-wrap:wrap}
.ds-lane-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.ds-lane-tab:hover{border-color:var(--line-2);color:var(--text)}
.ds-lane-tab.active{background:#16202F;border-color:var(--lime-dim);color:var(--lime);font-weight:600}
.ds-tab-count{padding:1px 8px;border-radius:999px;background:#1C2637;color:var(--muted);font-family:var(--mono);font-size:11px}
.ds-lane-tab.active .ds-tab-count{background:var(--lime);color:#0A0F17}
.ds-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 19px;display:flex;flex-direction:column;gap:13px}
.ds-card.best{border-color:var(--lime-dim)}
.ds-top{display:flex;gap:16px;align-items:flex-start}
.ds-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:11px}
.ds-titleline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ds-name{font-size:18px;font-weight:600}
.ds-lane-chip{padding:2px 8px;border-radius:6px;border:1px solid var(--line-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;color:var(--dim)}
.ds-lane-chip.best{border-color:var(--lime-dim);color:var(--lime)}
.ds-why{font-size:14px;color:var(--muted);line-height:1.55;max-width:80ch}
.ds-idea{font-size:14.5px}
.ds-idea b{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dimmer);font-weight:400;margin-right:8px}
.ds-pw{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:baseline}
.ds-pw dt{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dimmer)}
.ds-pw dd{margin:0;color:#D6DEE9}
.ds-contacts{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.ds-contacts h4{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--dimmer);font-weight:400}
.ds-person{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:14px}
.ds-person b{font-weight:600}
.ds-person .r{color:var(--muted)}
.ds-person .c{font-family:var(--mono);font-size:12.5px;color:var(--green)}
.ds-person .src{font-family:var(--mono);font-size:11px;color:var(--dimmer);text-decoration:underline}
.ds-approach{font-size:14px;color:#D6DEE9}
.ds-approach b{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dimmer);font-weight:400;margin-right:6px}
.ds-fit{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 14px;border:1px solid var(--line-2);border-radius:11px;min-width:78px}
.ds-fit .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--lime);line-height:1}
.ds-fit .l{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:var(--dimmer)}
.ds-fit .q{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-decoration:underline;margin-top:4px}
.ds-actions{display:flex;gap:9px;flex-wrap:wrap;border-top:1px solid #161E2A;margin-top:2px;padding-top:13px}
.ds-card.done{border-color:var(--sent-line)}
.ds-fit .q{background:none;border:none;padding:0;cursor:pointer}
.ds-draft{display:flex;flex-direction:column;gap:11px;padding-top:3px}
.ds-drafting{padding:15px 17px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;
  font-family:var(--mono);font-size:13px;color:var(--lime)}
.ds-drafting:after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;
  background:var(--lime);animation:blink 1s steps(2,start) infinite;vertical-align:middle}
@keyframes blink{to{visibility:hidden}}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;
  max-width:min(92vw,520px);padding:12px 18px;border-radius:11px;
  background:#16202F;border:1px solid var(--lime-dim);color:var(--text);
  font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
th{text-align:left;padding:12px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dimmer);border-bottom:1px solid var(--line);font-weight:400;white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid #161E2A;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#131C28}
td .b{font-weight:600}
td .s{color:var(--dim);font-size:13px}
.pager{display:flex;align-items:center;gap:12px;justify-content:flex-end;font-size:13px;color:var(--dim)}

/* ---- pipeline board ---- */
.kan{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.kancol{background:#0D1420;border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:10px;min-width:215px}
.kanhead{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dimmer)}
.kanhead b{padding:1px 7px;border-radius:999px;background:#1C2637;color:var(--muted);font-size:11px;font-weight:400}
.kancard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:5px}
.kancard .t{font-weight:600;font-size:15px;line-height:1.3}
.kancard .m{font-size:13px;color:var(--dim)}
.kancard .v{font-family:var(--mono);font-size:12px;color:var(--lime)}

/* ---- roster ---- */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px;display:flex;flex-direction:column;gap:13px}
.rtop{display:flex;align-items:center;gap:13px}
.rav{width:50px;height:50px;border-radius:50%;background:#16202F;border:1px solid var(--lime);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;font-weight:700;flex:0 0 auto}
.rname{min-width:0}

</style>
<style>
/* ---- live-page additions (not in the demo) ---- */
body.signin{padding-bottom:0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .panel{width:min(420px,100%);display:flex;flex-direction:column;gap:16px;padding:26px 24px}
.login .brand{padding:0}
.login .err{min-height:20px;font-size:13.5px;color:var(--amber)}
.login .btn.go{width:100%}
.who .out{align-self:flex-start;margin-top:2px;font-size:11px;color:var(--dim);text-decoration:underline;padding:0}
.who .out:hover{color:var(--text)}
.navlist button[aria-disabled="true"]{cursor:default}
</style>

<div id="app"></div>
<div id="toast" hidden></div>

<script>
/* ===================== the university portal =====================
   Home (this morning's sponsor leads), Sponsors (every business near
   campus, searchable, with a spreadsheet download), My Teams and Inventory.
   Teams and Inventory read /api/university/teams and /inventory; Home and
   Sponsors read the department's market (/api/university/market/*, routes/
   campus.js). Every read answers only for the signed-in account's own
   university. The rest of the nav is shown, as in the demo, and does
   nothing yet.                            */

const $  = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money = cents => "$" + (Math.round(Number(cents) || 0) / 100).toLocaleString("en-US");
const SEASONS = ["Fall","Winter","Spring"];
const WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve",
  "Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty"];
const word = n => WORDS[n] || String(n);

/* ONLY SCREENS THAT WORK. A first customer should not see doors that do not
   open: Outreach, Pipeline, Season Calendar, Reports, AI Command, Compliance
   and Settings come back here as they ship. Sponsor Scan IS the business
   list (id "sponsors": search, team and stage filters, named contact, reach,
   best fit, distance, Write a pitch, the spreadsheet). */
const NAV1 = [
  ["home","Home"], ["sponsors","Sponsor Scan"], ["teams","My Teams"], ["inventory","Inventory"]
];
const NAV2 = [];
const LIVE = { home:true, sponsors:true, teams:true, inventory:true };

let view = "home";
let ME = null;              /* from /api/university/market/me: teams, stages, sender */
let CARDS = [];             /* this morning's leads, /api/university/market/cards */
let HOME_TEAM = "";          /* the team picker on Home: "" is All teams, best fit first */
let HOME_SHOW_ALL = false;   /* All teams shows the best ten until asked for the rest */
let CARDS_FAILED = false;   /* the read failed: say so, never "no leads written yet" */
let NEAR = { total:0, withContact:0, rows:[] };
let SP = { q:"", team:"", contact:true, stage:"", rows:[], total:0, loading:false };
let invFilter = "All";
let university = null;      /* { id, name, ... } */
let TEAMS = [];             /* from /api/university/teams */
let ITEMS = [];             /* from /api/university/inventory */
let toastT = null;

function toast(msg){
  const el = $("toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true }, 2600);
}

/* ===================== data ===================== */
async function getJson(url){
  const r = await fetch(url, { credentials:"same-origin", headers:{ "Accept":"application/json" } });
  let body = null; try { body = await r.json() } catch (_) {}
  return { status:r.status, body:body || {} };
}

async function load(){
  const [t, i] = await Promise.all([getJson("/api/university/teams"), getJson("/api/university/inventory")]);
  const bad = [t, i].find(x => x.status !== 200);
  if (bad){
    if (bad.status === 401) return signin("");
    if (bad.status === 403 && bad.body.code === "UNIVERSITY_ROLE_REQUIRED")
      return signin("This account is not a university account. Sign in with your athletics department login.", true);
    if (bad.status === 403 && bad.body.code === "NO_UNIVERSITY_LINKED")
      return signin("This account is not linked to a university yet. Ask NILDash to link it.", true);
    return failed();
  }
  university = t.body.university || i.body.university || { name:"Your university" };
  TEAMS = t.body.teams || [];
  ITEMS = i.body.items || [];
  // The market side: who I am, this morning's leads, and how many businesses
  // near campus have a named person. Each read failing on its own leaves its
  // screen saying so, never the whole portal down.
  const [m, c, all, wc] = await Promise.all([getJson("/api/university/market/me"), getJson("/api/university/market/cards"),
    getJson("/api/university/market/search?limit=1"), getJson("/api/university/market/search?contact=1&limit=8&sort=distance")]);
  ME = m.status === 200 ? m.body : null;
  CARDS = c.status === 200 ? (c.body.cards || []) : [];
  CARDS_FAILED = c.status !== 200;
  NEAR = { total: all.status === 200 ? all.body.total || 0 : 0, withContact: wc.status === 200 ? wc.body.total || 0 : 0,
    rows: wc.status === 200 ? wc.body.rows || [] : [], failed: all.status !== 200 };
  shell(); paint(); adminViewBar();
}

/* The admin viewing this university (services/adminView): said on every
   screen, read-only, and one click back. */
function adminViewBar(){
  var old = document.getElementById("adminViewBar"); if (old) old.remove();
  if (!(ME && ME.me && ME.me.viewingAsAdmin)) return;
  var bar = document.createElement("div");
  bar.id = "adminViewBar";
  bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#fbbf24;color:#000;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap";
  var name = (ME.university && ME.university.name) || "this university";
  bar.textContent = "Viewing " + name + " as admin. Read-only: nothing is changed or sent as the school.";
  var back = document.createElement("button");
  back.textContent = "Back to admin";
  back.style.cssText = "font:700 12px inherit;padding:4px 10px;border-radius:6px;border:1px solid #000;background:#000;color:#fbbf24;cursor:pointer";
  back.onclick = async function(){
    try { await fetch("/api/admin/view-university", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ universityId: null }) }); } catch (_) {}
    location.href = "/admin";
  };
  bar.appendChild(back);
  document.body.appendChild(bar);
  document.body.style.paddingTop = "40px";
}

/* ===================== sign in ===================== */
function signin(message, signedInAsSomeoneElse){
  document.body.className = "signin";
  $("app").innerHTML = `
  <div class="login">
    <form class="panel" id="loginForm" autocomplete="on">
      <div class="brand"><span class="mark">N</span><span class="word">NIL<br>DASH</span></div>
      <div>
        <h3>University portal</h3>
        <p class="lede">Sign in with your athletics department account.</p>
      </div>
      <div class="field"><label for="lemail">EMAIL</label>
        <input class="inp" id="lemail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lpass">PASSWORD</label>
        <input class="inp" id="lpass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="lerr">${esc(message || "")}</div>
      <button type="submit" class="btn go" id="lgo">Sign in</button>
      ${signedInAsSomeoneElse ? `<button type="button" class="btn ghost sm" data-signout>Sign out of this account</button>` : ""}
    </form>
  </div>`;
  const f = $("lemail"); if (f) f.focus();
}

async function doSignin(e){
  e.preventDefault();
  const btn = $("lgo"); btn.disabled = true; btn.textContent = "Signing in…";
  $("lerr").textContent = "";
  try {
    const r = await fetch("/api/auth/login", {
      method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email:$("lemail").value.trim(), password:$("lpass").value })
    });
    if (!r.ok){
      let b = {}; try { b = await r.json() } catch (_) {}
      $("lerr").textContent = r.status === 429 ? "Too many attempts. Wait a minute and try again."
        : (b.error || "That email and password did not match.");
      btn.disabled = false; btn.textContent = "Sign in"; return;
    }
    await load();
  } catch (_) {
    $("lerr").textContent = "Could not reach NILDash. Check your connection and try again.";
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function signout(){
  try { await fetch("/api/auth/logout", { method:"POST", credentials:"same-origin" }) } catch (_) {}
  university = null; TEAMS = []; ITEMS = []; view = "home"; invFilter = "All"; CARDS = []; ME = null; SP = { q:"", team:"", contact:true, stage:"", rows:[], total:0, loading:false };
  signin("");
}

function failed(){
  document.body.className = "signin";
  $("app").innerHTML = `
  <div class="login"><div class="panel">
    <div class="brand"><span class="mark">N</span><span class="word">NIL<br>DASH</span></div>
    <div class="empty"><b>Could not load your portal</b>Something went wrong on our side. Try again in a moment.</div>
    <button type="button" class="btn go" data-retry>Try again</button>
  </div></div>`;
}

/* ===================== the shell (as in the demo) ===================== */
function initials(name){
  return String(name || "").split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "U";
}
function shell(){
  document.body.className = "";
  const name = university.name || "Your university";
  $("app").innerHTML = `
<div class="shell">
  <nav class="side">
    <div class="brand"><span class="mark">N</span><span class="word">NIL<br>DASH</span></div>
    <div class="eyebrow">UNIVERSITY PORTAL</div>
    <div class="navwrap"><div class="navlist" id="nav1"></div></div>
${NAV2.length ? `<div class="eyebrow">ADMINISTRATION</div>
    <div class="navwrap"><div class="navlist" id="nav2" style="margin-top:-8px"></div></div>` : ""}

/* ===================== TODAY (home) =====================
   What NILDash does for the department, in one sentence, then the work:
   this morning's leads, one card per business, grouped by team. Each card
   says who to talk to, how to reach them, why this business fits this team,
   and the email to send. Nothing is sent from here: the email opens in the
   department's own mail, and "Mark contacted" records it so nobody on staff
   pitches the same business twice.                                        */
const STAGE_TXT = { not_contacted:"Not contacted", contacted:"Contacted", replied:"Replied", in_talks:"In talks", deal_signed:"Deal signed", declined:"Declined", do_not_contact:"Do not contact" };
const stageLabel = k => ((ME && ME.stages || []).find(x => x.key === k) || {}).label || STAGE_TXT[k] || k;
function reachLine(c){
  const bits = [];
  if (c.email) bits.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
  if (c.phone) bits.push(`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`);
  if (c.instagram) bits.push(`<a href="https://instagram.com/${esc(String(c.instagram).replace(/^@/,""))}" target="_blank" rel="noopener">@${esc(String(c.instagram).replace(/^@/,""))}</a>`);
  if (c.website) bits.push(`<a href="${esc(c.website)}" target="_blank" rel="noopener">website</a>`);
  return bits.length ? `<div class="reach">${bits.join("")}</div>` : `<div class="reach">No direct contact yet: call or visit</div>`;
}
/* ONE CARD, ONE WAY TO REACH SOMEONE (services/cardChannel).
   email    the email, Open in email, Copy, Mark contacted
   call     who, the number, the best time, three talking points; Mark called.
            There is no email on a call card: there is no address to send it to.
   dm       the message and a Copy button, the Instagram link; Mark sent.
   program  a brand's athlete program: the message, Copy, the page; Mark applied. */
const CH_DONE = { email:"Mark contacted", call:"Mark called", dm:"Mark sent", program:"Mark applied" };
const CH_CHIP = { call:"CALL", dm:"INSTAGRAM DM", program:"BRAND PROGRAM" };
function leadCard(d, showTeam){
  const ch = d.channel || (d.contact_email ? "email" : "");
  const done = d.sent_at || (d.stage && d.stage !== "not_contacted");
  const who = d.contact_name ? `${esc(d.contact_name)}${d.contact_title ? ` <span>· ${esc(d.contact_title)}</span>` : ""}` : `<span>No name yet: the message goes to the business</span>`;
  const handle = String(d.contact_instagram || "").replace(/^@/,"");
  const doneBtn = done ? `<span class="chip green">${esc(stageLabel(d.stage || "contacted").toUpperCase())}</span>`
    : (CH_DONE[ch] ? `<button type="button" class="btn ghost sm" data-mark="${esc(d.id)}" data-channel="${esc(ch)}" data-brand="${esc(d.brand_name)}" data-team="${esc(d.team_id || "")}">${CH_DONE[ch]}</button>` : "");
  let main = "", tools = "";
  if (ch === "email"){
    const mailto = `mailto:${encodeURIComponent(d.contact_email)}?subject=${encodeURIComponent(d.subject || "")}&body=${encodeURIComponent(d.body || "")}`;
    main = `<div class="who">${who}</div>${reachLine({ email:d.contact_email, phone:d.contact_phone, instagram:d.contact_instagram })}
      ${d.email_is_shared ? `<div class="why" style="opacity:.75">${esc(d.contact_email)} is the business's shared inbox, not ${esc(String(d.contact_name || "their").split(" ")[0])}'s own address; the email is addressed to them by name.</div>` : ""}
      ${d.why ? `<div class="why">${esc(d.why)}</div>` : ""}
      <details><summary>Read the email</summary><pre>${esc(d.subject ? "Subject: " + d.subject + "\n\n" : "")}${esc(d.body || "")}</pre></details>`;
    tools = `<a class="btn go sm" href="${mailto}" data-sent="${esc(d.id)}" data-brand="${esc(d.brand_name)}" data-team="${esc(d.team_id || "")}">Open in email</a>
      <button type="button" class="btn ghost sm" data-copy="${esc(d.id)}">Copy email</button>`;
  } else if (ch === "call"){
    const pts = Array.isArray(d.talking_points) ? d.talking_points : [];
    main = `<div class="who">${who}</div>
      <div class="reach"><a href="tel:${esc(d.contact_phone)}">${esc(d.contact_phone)}</a></div>
      ${d.best_time ? `<div class="why"><b>Best time:</b> ${esc(d.best_time)}</div>` : ""}
      <ol class="points">${pts.map(p => `<li>${esc(p)}</li>`).join("")}</ol>
      <div class="why" style="opacity:.75">No email address for this person, so this is a call, not an email.</div>`;
    tools = `<a class="btn go sm" href="tel:${esc(d.contact_phone)}">Call</a>`;
  } else if (ch === "dm"){
    main = `<div class="who">${who}</div>
      <div class="reach"><a href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a>${d.contact_phone ? `<a href="tel:${esc(d.contact_phone)}">${esc(d.contact_phone)}</a>` : ""}</div>
      ${d.why ? `<div class="why">${esc(d.why)}</div>` : ""}
      <pre>${esc(d.body || "")}</pre>
      <div class="why" style="opacity:.75">No email address: send this as an Instagram message${d.contact_phone ? ", or call the number" : ""}.</div>`;
    tools = `<button type="button" class="btn go sm" data-copytext="${esc(d.body || "")}">Copy message</button>
      <a class="btn ghost sm" href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">Open Instagram</a>`;
  } else if (ch === "program"){
    main = `<div class="who"><span>A brand that runs an athlete program. Reach them through their program page.</span></div>
      ${d.why ? `<div class="why">${esc(d.why)}</div>` : ""}
      <details><summary>Read the message</summary><pre>${esc(d.body || "")}</pre></details>`;
    tools = `${d.program_url ? `<a class="btn go sm" href="${esc(d.program_url)}" target="_blank" rel="noopener">Program page</a>` : ""}
      <button type="button" class="btn ghost sm" data-copytext="${esc(d.body || "")}">Copy message</button>`;
  } else {
    main = `<div class="who">${who}</div><div class="reach">No email, phone or Instagram on file: nothing to send yet.</div>`;
  }
  /* EVERY WAY TO REACH THEM: a card with a handle offers the Instagram DM as
     the second action, beside the email or the call. */
  const dmSecond = (ch === "email" || ch === "call") && handle && d.dm_text
    ? `<div class="dm2"><div class="why"><b>Or on Instagram</b> <a href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a></div>
        <details><summary>Read the DM</summary><pre>${esc(d.dm_text)}</pre></details>
        <div class="toolrow"><button type="button" class="btn ghost sm" data-copytext="${esc(d.dm_text)}">Copy DM</button>
          <a class="btn ghost sm" href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">Open Instagram</a>
          ${done ? "" : `<button type="button" class="btn ghost sm" data-mark="${esc(d.id)}" data-channel="dm" data-brand="${esc(d.brand_name)}" data-team="${esc(d.team_id || "")}">Mark DM sent</button>`}</div></div>`
    : "";
  /* NO NAME YET: the night uses only free sources. "Find the owner" is the
     paid lookup for this one business (services/ownerLookup), never twice. */
  const findOwner = !d.contact_name && d.lane !== "social" && !done
    ? (d.owner_lookup_found === false
      ? `<div class="why" style="opacity:.75">We looked for the owner and found no name. The message is addressed to the business.</div>`
      : (ME && ME.me && ME.me.viewingAsAdmin ? "" : `<div class="toolrow"><button type="button" class="btn ghost sm" data-findowner="${esc(d.id)}">Find the owner</button>
          <span class="why" style="opacity:.75">Looks up who runs it and puts their name on the message.</span></div>`))
    : "";
  return `<div class="lead">
    ${showTeam && d.team_name ? `<div class="why" style="margin:0 0 4px;letter-spacing:.06em;text-transform:uppercase;font-size:11px">${esc(d.team_name)}</div>` : ""}
    <div class="biz">${esc(d.brand_name)}${CH_CHIP[ch] ? ` <span class="chip">${CH_CHIP[ch]}</span>` : ""}${dmSecond ? ` <span class="chip">+ DM</span>` : ""}</div>
    ${main}
    ${findOwner}
    <div class="toolrow">${tools}${doneBtn}</div>
    ${dmSecond}
  </div>`;
}

function spQuery(extra){
  const q = new URLSearchParams();
  if (SP.q) q.set("q", SP.q);
  if (SP.team) q.set("team", SP.team);
  if (SP.contact) q.set("contact", "1");
  if (SP.stage) q.set("stage", SP.stage);
  for (const [k,v] of Object.entries(extra || {})) q.set(k, v);
  return q.toString();
}

/* Write a pitch for one business and a team, shown in a box with the email
   ready to open. A business someone on staff has already worked asks first
   (the server answers needsAck with the history). */
async function writePitch(brand, ack){
  const teams = (ME && ME.teams) || TEAMS;
  const teamId = SP.team || (await chooseTeam(teams));
  if (!teamId) return;
  toast("Writing the email…");
  const r = await fetch("/api/university/market/pitch", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ brand, teamId, acknowledgeHistory: !!ack }) });
  let b = {}; try { b = await r.json() } catch (_) {}
  if (r.status === 409 && b.needsAck){
    const h = b.history || {};
    const who = h.lastTouchBy ? ` by ${h.lastTouchBy}` : "";
    if (confirm(`Someone on your staff already contacted ${brand}${who}${h.lastTouchAt ? " on " + String(h.lastTouchAt).slice(0,10) : ""}. Write another email anyway?`)) return writePitch(brand, true);
    return;
  }
  if (!r.ok || !b.ok){ toast(b.error ? "Could not write it: " + b.error : "Could not write it. Try again in a minute."); return; }
  const d = b.draft;
  const c = d.contact || {};
  const handle = String(c.instagram || "").replace(/^@/,"");
  const head = d.channel === "call" ? `Call ${esc(c.name || "the owner")} at <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>${d.bestTime ? `. Best time: ${esc(d.bestTime)}` : ""}. There is no email address for this person.`
    : d.channel === "dm" ? `${esc(c.name || "")} on Instagram: <a href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a>. There is no email address for this person.`
    : (c.name ? `To ${esc(c.name)} &lt;${esc(d.to)}&gt;` : esc(d.to || ""));
  const text = d.channel === "email" ? "Subject: " + d.subject + "\n\n" + d.body : d.body;
  showModal(`<h3 style="margin:0 0 6px">${esc(brand)}${d.channel !== "email" ? ` <span class="chip">${d.channel === "call" ? "CALL" : "INSTAGRAM DM"}</span>` : ""}</h3>
    <p class="lede">${head}</p>
    <pre>${esc(text)}</pre>
    <div class="toolrow" style="margin-top:12px">
      ${d.channel === "email" && d.mailto ? `<a class="btn go sm" href="${esc(d.mailto)}" data-sent="${esc(d.id)}" data-brand="${esc(brand)}" data-team="${esc(teamId)}">Open in email</a>` : ""}
      ${d.channel === "call" ? `<a class="btn go sm" href="tel:${esc(c.phone)}">Call</a>` : ""}
      ${d.channel === "dm" ? `<a class="btn ghost sm" href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">Open Instagram</a>` : ""}
      ${d.channel !== "call" ? `<button type="button" class="btn ghost sm" data-copytext="${esc(text)}">${d.channel === "email" ? "Copy email" : "Copy message"}</button>` : ""}
      <button type="button" class="btn ghost sm" data-mark="${esc(d.id)}" data-channel="${esc(d.channel)}" data-brand="${esc(brand)}" data-team="${esc(teamId)}">${CH_DONE[d.channel] || "Mark contacted"}</button>
      <button type="button" class="btn ghost sm" data-close>Close</button>
    </div>
    ${d.channel !== "dm" && d.dmText && handle ? `<p class="lede" style="margin-top:14px">Or on Instagram: <a href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a></p>
      <pre>${esc(d.dmText)}</pre>
      <div class="toolrow"><button type="button" class="btn ghost sm" data-copytext="${esc(d.dmText)}">Copy DM</button>
        <a class="btn ghost sm" href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">Open Instagram</a></div>` : ""}`);
}
function chooseTeam(teams){
  return new Promise((resolve) => {
    showModal(`<h3 style="margin:0 0 6px">Which team is this pitch for?</h3>
      <div class="toolrow" style="margin-top:10px">${teams.map(t => `<button type="button" class="btn ghost sm" data-pickteam="${esc(t.id)}">${esc(t.name)}</button>`).join("")}</div>
      <div class="toolrow" style="margin-top:12px"><button type="button" class="btn ghost sm" data-close>Cancel</button></div>`);
    window._pickTeam = (id) => { closeModal(); resolve(id); };
    window._pickCancel = () => resolve(null);
  });
}
function showModal(html){ closeModal(); const m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(m); }
function closeModal(){ const m = $("modal"); if (m) m.remove(); }

/* "Mark contacted" and "Open in email" both record a touch, which moves the
   business to Contacted for the whole staff. */
const TOUCH = { email:["email","Sent the NILDash email"], call:["phone","Called (NILDash call card)"], dm:["instagram","Sent the NILDash Instagram message"], program:["other","Applied through the brand's program page"] };
async function markContacted(brand, teamId, draftId, channel){
  const [ch, summary] = TOUCH[channel || "email"] || TOUCH.email;
  await fetch("/api/university/market/business/touch", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ brand, channel: ch, direction:"out", summary, stage:"contacted", teamId: teamId || null, draftId: draftId || null }) }).catch(() => {});
  const d = CARDS.find(x => x.id === draftId); if (d){ d.stage = "contacted"; d.sent_at = new Date().toISOString(); }
}

/* ===================== INVENTORY ===================== */
const seasonOf = r => r.team_id ? (r.season || "") : "Department";
const teamNameOf = r => r.team_id ? (r.team_name || "") : "Department wide";
const STATUS_CHIP = { available:["grey","AVAILABLE"], reserved:["amber","RESERVED"], sold:["green","SOLD"] };

function vInventory(){
  const filters = ["All"].concat(SEASONS, ["Department"]);
  const rows = ITEMS.filter(r => invFilter === "All" || seasonOf(r) === invFilter);
  const total = rows.reduce((s,r)=>s+r.price_cents,0);
  const all = ITEMS.reduce((s,r)=>s+r.price_cents,0);
  const sold = ITEMS.filter(r => r.status === "sold").reduce((s,r)=>s+r.price_cents,0);

  return `
  <div class="board">
    <div class="head">
      <h1>Inventory</h1>
      <p>Everything the athletics department owns that a local business would pay for. Banner space,
         program pages, PA time, table fronts, meals. Priced once, sold as many times as there are teams.
         Right now none of it is assigned to anyone, which is the only reason none of it is sold.</p>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><span class="kpi-label">SELLABLE ITEMS</span><span class="kpi-val">${ITEMS.length}</span><span class="kpi-note">across ${TEAMS.length} teams</span></div>
      <div class="kpi"><span class="kpi-label">TOTAL VALUE</span><span class="kpi-val lime">${money(all)}</span><span class="kpi-note">a full year</span></div>
      <div class="kpi"><span class="kpi-label">SOLD</span><span class="kpi-val">${money(sold)}</span><span class="kpi-note">${sold ? "sold so far" : "nothing yet"}</span></div>
      <div class="kpi"><span class="kpi-label">ASKS DRAFTED</span><span class="kpi-val">0</span><span class="kpi-note">$0 in front of you</span></div>
    </div>

    <div class="toolrow">
      ${filters.map(f => `<button type="button" class="ds-lane-tab ${f===invFilter?"active":""}" data-inv="${esc(f)}">${esc(f)}</button>`).join("")}
      <span class="grow"></span>
      <span class="stats"><span>Showing <b>${money(total)}</b></span></span>
      <button type="button" class="btn ghost sm" data-do="export">Download as spreadsheet</button>
    </div>

    <div class="tablewrap">
      <table><thead><tr>
        <th>Item</th><th>Team</th><th>Season</th><th>Price</th><th>Status</th>
      </tr></thead><tbody>
      ${rows.map(r => { const c = STATUS_CHIP[r.status] || STATUS_CHIP.available; return `<tr>
        <td data-l="ITEM"><span class="b">${esc(r.name)}</span></td>
        <td data-l="TEAM">${esc(teamNameOf(r))}</td>
        <td data-l="SEASON"><span class="s">${esc(seasonOf(r))}</span></td>
        <td data-l="PRICE"><span style="color:var(--lime)">${money(r.price_cents)}</span></td>
        <td data-l="STATUS"><span class="chip ${c[0]}">${c[1]}</span></td>
      </tr>` }).join("")}
      </tbody></table>
    </div>
  </div>`;
}

/* The spreadsheet, built here from what is on screen. Nothing is sent anywhere. */
function exportCsv(){
  const rows = ITEMS.filter(r => invFilter === "All" || seasonOf(r) === invFilter);
  const cell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : String(v);
  const lines = [["Item","Team","Season","Price","Status"]].concat(rows.map(r =>
    [r.name, teamNameOf(r), seasonOf(r), (r.price_cents/100).toFixed(2), r.status]));
  const blob = new Blob([lines.map(l => l.map(cell).join(",")).join("\n") + "\n"], { type:"text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (String(university.name || "inventory").replace(/[^A-Za-z0-9]+/g,"-") + "-inventory.csv").toLowerCase();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const VIEWS = { home:vHome, sponsors:vSponsors, teams:vTeams, inventory:vInventory };
function paint(){
  $("view").innerHTML = (VIEWS[view] || vHome)();
  paintNav();
  window.scrollTo({ top:0 });
}
function go(v){ if (!LIVE[v]) return; view = v; paint() }

/* ===================== events ===================== */
document.addEventListener("submit", e => { if (e.target.id === "loginForm") doSignin(e) });
/* Sponsors filters: search on Enter or after a pause, the rest at once. */
let _spT = null;
document.addEventListener("input", e => {
  if (e.target.id === "spq"){ clearTimeout(_spT); _spT = setTimeout(() => { SP.q = e.target.value.trim(); spLoad(); }, 400); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "spteam"){ SP.team = e.target.value; spLoad(); return }
  if (id === "spstage"){ SP.stage = e.target.value; spLoad(); return }
  if (id === "spcontact"){ SP.contact = e.target.checked; spLoad(); return }
  if (e.target.dataset && e.target.dataset.stage){
    const brand = e.target.dataset.stage, stage = e.target.value;
    fetch("/api/university/market/business/stage", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ brand, stage }) })
      .then(r => { toast(r.ok ? `${brand}: ${stageLabel(stage)}` : "Could not save that. Try again."); const row = SP.rows.find(x => x.brand === brand); if (row && r.ok) row.stage = stage; });
  }
});
async function findOwnerFor(id, btn){
  if (btn) { btn.disabled = true; btn.textContent = "Looking..."; }
  let r;
  try {
    r = await fetch(`/api/university/market/cards/${encodeURIComponent(id)}/find-owner`, { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" }, body:"{}" });
  } catch (_) { toast("Could not reach NILDash. Try again."); if (btn) { btn.disabled = false; btn.textContent = "Find the owner"; } return; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || "The lookup failed. Try again later."); if (btn) { btn.disabled = false; btn.textContent = "Find the owner"; } return; }
  const i = CARDS.findIndex(x => x.id === id);
  if (i >= 0) CARDS[i] = { ...CARDS[i], ...j.card, owner_lookup_found: j.found };
  toast(j.found ? `Found ${String(j.card.contact_name || "the owner")}. The message now uses their name.` : "No owner name found. The message stays addressed to the business.");
  paint();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-goto],[data-inv],[data-do],[data-signout],[data-retry],[data-copy],[data-copytext],[data-mark],[data-sent],[data-pitch],[data-pickteam],[data-close],[data-findowner],[data-hometeam],[data-homeall]");
  if (!t) return;
  const copy = (txt) => { try { navigator.clipboard.writeText(txt); toast("Copied. Paste it into your email."); } catch (_) { toast("Select the text and copy it."); } };
  if (t.dataset.copy !== undefined){ const d = CARDS.find(x => x.id === t.dataset.copy); if (d) copy((d.subject ? "Subject: " + d.subject + "\n\n" : "") + (d.body || "")); return }
  if (t.dataset.copytext !== undefined){ copy(t.dataset.copytext); return }
  if (t.dataset.mark !== undefined){ markContacted(t.dataset.brand, t.dataset.team, t.dataset.mark, t.dataset.channel).then(() => { toast("Marked for your whole staff."); paint(); }); return }
  if (t.dataset.sent !== undefined){ markContacted(t.dataset.brand, t.dataset.team, t.dataset.sent).then(() => { if (view === "home") paint(); }); return }   /* the mailto opens as usual */
  if (t.dataset.hometeam !== undefined){ HOME_TEAM = t.dataset.hometeam; HOME_SHOW_ALL = false; paint(); window.scrollTo({ top: 0 }); return }
  if (t.dataset.homeall !== undefined){ HOME_SHOW_ALL = true; paint(); return }
  if (t.dataset.findowner !== undefined){ findOwnerFor(t.dataset.findowner, t); return }
  if (t.dataset.pitch !== undefined){ writePitch(t.dataset.pitch); return }
  if (t.dataset.pickteam !== undefined){ if (window._pickTeam) window._pickTeam(t.dataset.pickteam); return }
  if (t.dataset.close !== undefined){ closeModal(); if (window._pickCancel) { window._pickCancel(); window._pickCancel = null; } return }
  if (t.dataset.goto !== undefined){ e.preventDefault(); go(t.dataset.goto); return }
  if (t.dataset.inv !== undefined){ invFilter = t.dataset.inv; paint(); return }
  if (t.dataset.do === "export"){ exportCsv(); toast("Downloaded."); return }
  if (t.dataset.signout !== undefined){ signout(); return }
  if (t.dataset.retry !== undefined){ load(); return }
});

load();
</script>
