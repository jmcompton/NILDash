<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NILDash CRM</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/crm.webmanifest">
<link rel="apple-touch-icon" href="/crm-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1A14">
<!-- The founder's CRM (services/founderCrm). Admin only. Every value that
     reaches the page goes through esc() before it is written. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: app bar + object tabs on top; each view is a full-width workspace.
   Record pages use a two-column layout (work on the left, details on the right). */
:root {
  --bg: #F1F4F2; --panel: #FFFFFF; --panel-2: #F5F8F6; --line: #DCE3DE; --line-2: #C9D3CC;
  --fg: #14211A; --muted: #5E7066; --accent: #1F8A55; --accent-soft: #E3F3EA; --accent-ink: #FFFFFF;
  --bar: #0F1A14; --bar-fg: #EAF2EC; --bar-accent: #4CC283;
  --warn: #9A6A07; --warn-soft: #FBF1DC; --late: #B4422B; --late-soft: #FBE7E2; --info: #2F6DB5; --info-soft: #E5EEF9;
  --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgba(16, 32, 24, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1A14; --panel: #15231B; --panel-2: #1B2C22; --line: #2A3D31; --line-2: #36503F;
  --fg: #EAF2EC; --muted: #9AB0A2; --accent: #4CC283; --accent-soft: #1D3A2A; --accent-ink: #0F1A14;
  --bar: #0A120D; --bar-fg: #EAF2EC; --bar-accent: #4CC283;
  --warn: #E8B04B; --warn-soft: #3A3018; --late: #EF7A62; --late-soft: #3D211B; --info: #7FB0EA; --info-soft: #1B2B3F;
  --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1A14; --panel: #15231B; --panel-2: #1B2C22; --line: #2A3D31; --line-2: #36503F;
  --fg: #EAF2EC; --muted: #9AB0A2; --accent: #4CC283; --accent-soft: #1D3A2A; --accent-ink: #0F1A14;
  --bar: #0A120D; --bar-fg: #EAF2EC; --bar-accent: #4CC283;
  --warn: #E8B04B; --warn-soft: #3A3018; --late: #EF7A62; --late-soft: #3D211B; --info: #7FB0EA; --info-soft: #1B2B3F;
  --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* App bar */
.appbar { padding-top: env(safe-area-inset-top, 0px); background: var(--bar); color: var(--bar-fg); display: flex; align-items: center; gap: 14px; min-height: 54px; box-sizing: content-box; }
.brand { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .4px; white-space: nowrap; }
.brand span { color: var(--bar-accent); }
.brand em { font-style: normal; font-weight: 600; opacity: .7; margin-left: 6px; font-size: 14px; }
.search { flex: 1; max-width: 520px; position: relative; }
.search input[type=search] { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: var(--bar-fg);
  border-radius: 8px; padding: 8px 12px 8px 32px; }
.search input::placeholder { color: rgba(234,242,236,.55); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .6; }
.appbar .btn.primary { margin-left: auto; }
.tabs { background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 13px 12px 11px; font-weight: 600; color: var(--muted); cursor: pointer;
  border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; background: var(--late); color: #fff; border-radius: 999px; padding: 1px 6px; }
.syncline { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 12px; }
main { padding-block: 18px 60px; max-width: 1440px; margin: 0 auto; }
#status { color: var(--muted); margin: 0 0 12px; }
#status:empty { display: none; }

/* Common */
.btn { font-weight: 600; font-size: 13px; border: 1px solid var(--line-2); background: var(--panel); color: var(--fg);
  border-radius: 7px; padding: 6px 11px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); }
.btn.danger { color: var(--late); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.panel > h3 { margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; }
.panel > h3 .n { font-size: 12px; color: var(--muted); font-weight: 600; }
.panel > h3 .right { margin-left: auto; display: flex; gap: 6px; }
.panel .body { padding: 14px 16px; }
.empty { color: var(--muted); padding: 14px 16px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 2px 7px; border-radius: 5px; background: var(--panel-2);
  color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.pill.customer { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.investor { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.university, .pill.partner { background: var(--info-soft); color: var(--info); border-color: transparent; }
.muted { color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 500; border: 1px solid var(--line-2); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar select { border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px; padding: 5px 8px; }
h1.page { font-family: var(--display); font-size: 24px; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 16px; }

/* Today */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { padding: 12px 14px; cursor: pointer; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); }
.kpi b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12px; font-weight: 600; }
.kpi.late b { color: var(--late); } .kpi.hot b { color: var(--accent); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.task { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 4px; border-left: 4px solid transparent; }
.task:first-of-type { border-top: 0; }
.task.missed { border-left-color: var(--info); } .task.late { border-left-color: var(--late); } .task.today { border-left-color: var(--accent); }
.trow { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-align: left; }
.link:hover { text-decoration: underline; }
.task .link { font-size: 15px; }
.due { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.due.late { color: var(--late); font-weight: 600; }
.next { font-weight: 500; }
.lastline { font-size: 13px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.mini { padding: 9px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.mini:first-of-type { border-top: 0; }
.mini .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }

/* Table */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 980px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--panel-2); position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
th[aria-sort="ascending"]::after { content: " \25B2"; font-size: 9px; } th[aria-sort="descending"]::after { content: " \25BC"; font-size: 9px; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel-2); }
td.nx { max-width: 340px; } td .sub { display: block; color: var(--muted); font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.lane { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-height: 160px; }
.lane h4 { margin: 0; padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.lane.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.lane .cards { padding: 8px; display: grid; gap: 8px; }
.dcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; cursor: grab; box-shadow: var(--shadow); }
.dcard .nm { font-weight: 700; } .dcard .og { color: var(--muted); font-size: 12px; }
.dcard .nx { font-size: 12px; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dcard .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; gap: 6px; }

/* Activity */
.day { padding: 8px 16px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel-2); border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; border-radius: 10px 10px 0 0; }
.ev { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.ico.email { background: var(--info-soft); color: var(--info); } .ico.inbound { background: var(--warn-soft); color: var(--warn); }
.ico.meeting { background: var(--accent); color: var(--accent-ink); } .ico.note, .ico.stage { background: var(--panel-2); color: var(--muted); }
.ev .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ev .hd .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.ev .tx { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Record */
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.rhead { padding: 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.avatar { width: 48px; height: 48px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 18px; flex: none; }
.rhead h1 { font-family: var(--display); font-size: 22px; margin: 0; line-height: 1.15; }
.rhead .who { color: var(--muted); }
.rhead .btns { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.highlights { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.highlights div { padding: 10px 16px; border-left: 1px solid var(--line); min-width: 0; }
.highlights div:first-child { border-left: 0; }
.highlights small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.highlights span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path { display: flex; margin: 14px 0; overflow-x: auto; }
.step { flex: 1; min-width: 110px; border: 0; background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 13px; padding: 9px 18px 9px 22px;
  cursor: pointer; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); margin-right: -6px; white-space: nowrap; }
.step:first-child { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); border-radius: 8px 0 0 8px; padding-left: 14px; }
.step.past { background: var(--accent-soft); color: var(--accent); }
.step.cur { background: var(--accent); color: var(--accent-ink); }
.step.parked.cur { background: var(--muted); color: var(--panel); }
.step:hover { filter: brightness(.97); }
.rcols { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.nextbox .what { font-size: 16px; font-weight: 600; }
.nextbox .when { color: var(--muted); margin-top: 2px; }
.say { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.say small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
.composer { display: grid; grid-template-columns: 150px 150px minmax(0, 1fr); gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.composer textarea { grid-column: 1 / -1; min-height: 64px; }
.composer .row { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type=text], input[type=email], input[type=url], input[type=date], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
dl.det { margin: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); }
dl.det dt, dl.det dd { padding: 8px 16px; border-top: 1px solid var(--line); margin: 0; }
dl.det dt { color: var(--muted); font-size: 12px; font-weight: 600; padding-right: 0; }
dl.det dd { overflow-wrap: anywhere; display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
dl.det dt:first-of-type, dl.det dt:first-of-type + dd { border-top: 0; }
.copy { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; flex: none; }
.copy:hover { color: var(--accent); }
.mail { display: grid; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mail .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; }
.mail label { display: grid; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mail textarea { min-height: 150px; field-sizing: content; max-height: 60vh; }
.mail .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mail .row select { width: auto; }
.mailmsg { font-size: 13px; color: var(--muted); }
.mailmsg.err { color: var(--late); } .mailmsg.ok { color: var(--accent); font-weight: 600; }
.em { padding: 10px 16px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.em:first-child { border-top: 0; }
.em .hd { display: flex; gap: 8px; align-items: baseline; }
.em .hd b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.em .hd .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.em .sm { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dir { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); flex: none; }
.dir.them { background: var(--warn-soft); color: var(--warn); }
.em a, dl.det a { color: var(--accent); font-weight: 600; }
.mlhead { padding: 8px 16px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel-2); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.mlhead .btn { margin-left: auto; padding: 3px 8px; font-size: 12px; }
.notes textarea { field-sizing: content; max-height: 75vh; border: 0; border-radius: 0 0 10px 10px; min-height: 240px; padding: 14px 16px; line-height: 1.55; background: var(--panel); }
.saved { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Dialogs */
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding: 18px; }
dialog h2 { grid-column: 1 / -1; margin: 0 0 4px; font-family: var(--display); font-size: 19px; }
dialog label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
dialog label.full { grid-column: 1 / -1; }
dialog .foot { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
dialog .foot .left { margin-right: auto; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--bar); color: var(--bar-fg); padding: 9px 14px;
  border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.on { opacity: 1; }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cols, .rcols { grid-template-columns: minmax(0, 1fr); }
  .highlights { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .highlights div:nth-child(4) { border-left: 0; }
  .highlights div:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .appbar { height: auto; flex-wrap: wrap; padding-block: 10px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .syncline { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .highlights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .highlights div:nth-child(odd) { border-left: 0; } .highlights div:nth-child(4) { border-left: 1px solid var(--line); }
  .highlights div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .composer { grid-template-columns: 1fr 1fr; }
  .composer .slot { grid-column: 1 / -1; }
  dialog form { grid-template-columns: 1fr; }
  dl.det { grid-template-columns: 100px minmax(0, 1fr); }
}
</style>

</head>
<body>
<div class="appbar pad">
  <div class="brand">NIL<span>DASH</span><em>CRM</em></div>
  <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search people, companies, notes" aria-label="Search"></label>
  <button class="btn primary" id="newBtn" type="button">+ New contact</button>
</div>
<nav class="tabs pad" aria-label="Views">
  <button class="tab" data-view="today" type="button">Today <span class="n" id="todayN" hidden></span></button>
  <button class="tab" data-view="contacts" type="button">Contacts</button>
  <button class="tab" data-view="pipeline" type="button">Pipeline</button>
  <button class="tab" data-view="activity" type="button">Activity</button>
  <span class="syncline" id="syncLine"></span>
</nav>
<main class="pad">
  <p id="status">Loading your contacts…</p>
  <div id="view"></div>
</main>

<dialog id="editDlg">
  <form id="editForm" method="dialog">
    <h2 id="editTitle">New contact</h2>
    <label>Name<input type="text" name="name" required></label>
    <label>Title<input type="text" name="title" placeholder="Founder, NIL Director…"></label>
    <label>Company<input type="text" name="org"></label>
    <label>Type<select name="group"></select></label>
    <label>Stage<select name="stage"></select></label>
    <label>Best way to reach<select name="channel">
      <option value="text">Text</option><option value="email">Email</option><option value="linkedin">LinkedIn</option><option value="call">Call</option></select></label>
    <label>Email<input type="email" name="email"></label>
    <label>Phone<input type="text" name="phone"></label>
    <label>LinkedIn URL<input type="url" name="linkedin" placeholder="https://www.linkedin.com/in/…"></label>
    <label>Conversation link<input type="url" name="link" placeholder="Email or message thread"></label>
    <label>Monthly value ($)<input type="number" name="value" min="0" step="1"></label>
    <label>How they found you<input type="text" name="source"></label>
    <label class="full">Next step<input type="text" name="next"></label>
    <label>Next step date<input type="date" name="due"></label>
    <label>Status<select name="state"><option value="open">Open</option><option value="waiting">Waiting on them</option><option value="done">No follow-up</option></select></label>
    <label class="full">Message to send<textarea name="say" rows="3"></textarea></label>
    <div class="foot">
      <button class="btn danger left" type="button" id="delBtn" hidden>Remove</button>
      <button class="btn" value="cancel" formnovalidate type="submit">Cancel</button>
      <button class="btn primary" value="save" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="logDlg">
  <form id="logForm" method="dialog">
    <h2 id="logTitle">Log activity</h2>
    <div class="full chips" role="group" aria-label="Quick log">
      <button class="chip" type="button" data-q="no_answer">No answer</button>
      <button class="chip" type="button" data-q="voicemail">Left voicemail</button>
      <button class="chip" type="button" data-q="talked">Talked</button>
      <button class="chip" type="button" data-q="texted">Texted</button>
      <button class="chip" type="button" data-q="emailed">Emailed</button>
    </div>
    <label>What happened<select name="type"></select></label>
    <label>Date<input type="date" name="at" required></label>
    <label class="full">Details<textarea name="text" rows="3" placeholder="What you said, what they said, what's agreed"></textarea></label>
    <label class="full">Next step<input type="text" name="next"></label>
    <label>Follow up<select name="when">
      <option value="keep">Keep current date</option><option value="0">Today</option><option value="1">Tomorrow</option><option value="2">In 2 days</option>
      <option value="7">In a week</option><option value="14">In 2 weeks</option><option value="30">In a month</option>
      <option value="date">Pick a date</option><option value="waiting">Waiting on them</option><option value="close">No follow-up needed</option></select></label>
    <label>On<input type="date" name="due"></label>
    <div class="foot">
      <button class="btn" value="cancel" formnovalidate type="submit">Cancel</button>
      <button class="btn primary" value="save" type="submit">Save</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const TYPES = { customer: 'Customer', prospect: 'Prospect', partner: 'Partner', investor: 'Investor', university: 'University', advisor: 'Advisor', other: 'Other' };
  const STAGES = [['new', 'New lead'], ['reached', 'Reached out'], ['talking', 'In conversation'], ['meeting', 'Meeting set'], ['trial', 'Free access'], ['active', 'Active'], ['parked', 'Parked']];
  const STAGE = Object.fromEntries(STAGES);
  const ACT = { call: 'Call', text: 'Text', email: 'Email', linkedin: 'LinkedIn', meeting: 'Meeting', inbound: 'They reached out', note: 'Note', stage: 'Stage change', done: 'Follow-up done' };
  const ICON = { call: 'CL', text: 'TX', email: 'EM', linkedin: 'in', meeting: 'MT', inbound: 'IN', note: 'NT', stage: '→', done: '✓' };
  const CH = { text: 'Text', email: 'Email', linkedin: 'LinkedIn', call: 'Call' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => ymd(new Date());
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
  const parse = (s) => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s); };
  const fmt = (s, long) => { const d = parse(s); if (!d || isNaN(d)) return ''; return d.toLocaleDateString(undefined, long ? { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' }); };
  const daysFrom = (s) => { const d = parse(s); if (!d) return null; const t = parse(today()); return Math.round((d - t) / 86400000); };
  const rel = (s) => { const n = daysFrom(s); if (n == null) return ''; if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
    if (n < 0) return Math.abs(n) + ' days late'; if (n < 7) return parse(s).toLocaleDateString(undefined, { weekday: 'long' }); return fmt(s); };
  const ago = (s) => { const n = daysFrom(s); if (n == null) return ''; if (n === 0) return 'today'; if (n === -1) return 'yesterday'; if (n < 0) return Math.abs(n) + 'd ago'; return fmt(s); };
  const initials = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

  let db = null, mcp = null, rows = [], view = 'today', recId = null, q = '';
  const M365 = 'Microsoft 365';
  const drafts = {}, mail = {}; let mailOk = false;
  let shown = 200;
  let typeF = 'all', stageF = 'all', sortK = 'due', sortDir = 1, actF = 'all', editing = null, logging = null, delArm = false;
  try { view = localStorage.getItem('crm-view') || 'today'; typeF = localStorage.getItem('crm-type') || 'all'; } catch (_) {}
  if (view === 'record') view = 'today';

  function bucket(r) {
    if (r.state === 'done') return 'done';
    if (r.lastFrom === 'them') return 'missed';
    if (r.stage === 'parked') return 'parked';
    if (r.state === 'waiting') return 'waiting';
    const n = daysFrom(r.due);
    if (n == null) return 'later';
    if (n < 0) return 'late'; if (n === 0) return 'today'; if (n <= 7) return 'week'; return 'later';
  }
  const acts = (r) => {
    const a = (Array.isArray(r.activity) ? r.activity : []).map((x) => Object.assign({}, x));
    (Array.isArray(r.log) ? r.log : []).forEach((x) => a.push({ at: x.at, type: 'done', text: x.text }));
    return a.sort((x, y) => String(y.at || '').localeCompare(String(x.at || '')));
  };
  const lastTouch = (r) => { const a = acts(r).filter((x) => x.type !== 'stage' && x.type !== 'note'); const l = a[0] ? a[0].at : ''; return [l, r.lastAt || ''].sort().pop(); };
  const matches = (r) => { if (!q) return true; const s = [r.name, r.org, r.title, r.notes, r.next, r.email, r.source].join(' ').toLowerCase(); return q.toLowerCase().split(/\s+/).every((w) => s.includes(w)); };
  const typeOk = (r) => typeF === 'all' || (r.group || 'other') === typeF;
  const byId = (id) => rows.find((r) => r.id === id);

  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
  async function copy(t) {
    try { await navigator.clipboard.writeText(t); toast('Copied'); return; } catch (_) {}
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (_) { toast('Could not copy'); } ta.remove();
  }
  const API = '/api/admin/crm';
  async function api(method, path, data) {
    const r = await fetch(API + path, { method, credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
    if (r.status === 401) { location.href = '/app'; throw new Error('signed out'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'failed');
    return j;
  }
  const REAL = (x) => x.type !== 'note' && x.type !== 'stage' && x.type !== 'done';
  // Who wrote last, worked out from the history itself.
  function decorate(r) {
    const a = acts(r).filter(REAL)[0];
    if (a) { r.lastFrom = a.type === 'inbound' ? 'them' : 'me'; r.lastAt = a.at; r.lastSnippet = String(a.text || '').slice(0, 140);
      r.lastSource = a.type === 'inbound' ? (CH[r.channel] || '').toLowerCase() : (ACT[a.type] || '').toLowerCase(); }
    return r;
  }
  let loaded = false;
  async function load() {
    try {
      const j = await api('GET', '/contacts?full=1');
      rows = (j.contacts || []).map(decorate); loaded = true; db = true;
      $('status').textContent = rows.length ? '' : 'No contacts yet. Click + New contact to add one.';
      safeRender();
    } catch (e) { if (!loaded) $('status').textContent = "Can't reach your contacts. Reload the page."; }
  }
  // A save is the changed fields plus any new history lines (the ones with no id yet).
  async function save(id, patch) {
    try {
      const p = Object.assign({}, patch);
      const fresh = Array.isArray(p.activity) ? p.activity.filter((x) => !x.id) : [];
      ['activity', 'lastFrom', 'lastAt', 'lastSource', 'lastSnippet', 'updatedAt', 'log', 'handle'].forEach((k) => delete p[k]);
      if (Object.keys(p).length) await api('PATCH', '/contacts/' + encodeURIComponent(id), p);
      for (const x of fresh) await api('POST', '/contacts/' + encodeURIComponent(id) + '/activity', { type: x.type, text: x.text, at: x.at === today() ? new Date().toISOString() : x.at });
      await load(); render();
      return true;
    } catch (e) { toast('Could not save. Try again.'); return false; }
  }
  const tel = (r) => String(r.phone || '').replace(/[^0-9+]/g, '');
  const reach = (r) => (tel(r) ? `<a class="btn" href="tel:${esc(tel(r))}">Call</a><a class="btn" href="sms:${esc(tel(r))}">Text</a>` : '');
  const pills = (r) => `<span class="pill ${esc(r.group || 'other')}">${esc(TYPES[r.group] || 'Other')}</span>` + (r.channel ? ` <span class="pill">${esc(CH[r.channel] || r.channel)}</span>` : '');
  const convLink = (r) => /^https:\/\//.test(r.link || '') ? r.link : (/^https:\/\//.test(r.linkedin || '') ? r.linkedin : '');
  const handleOf = (r) => r.channel === 'email' ? (r.email || r.handle) : (r.channel === 'text' || r.channel === 'call') ? (r.phone || r.handle) : (r.linkedin || r.handle);

  // ---------- Views ----------
  function render() {
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.view === (view === 'record' ? '' : view) ? 'page' : 'false'));
    const urgent = rows.filter((r) => ['missed', 'late', 'today'].includes(bucket(r))).length;
    $('todayN').hidden = !urgent; $('todayN').textContent = urgent;
    const v = $('view');
    if (view === 'record' && byId(recId)) v.innerHTML = renderRecord(byId(recId));
    else if (view === 'contacts') v.innerHTML = renderContacts();
    else if (view === 'pipeline') v.innerHTML = renderPipeline();
    else if (view === 'activity') v.innerHTML = renderActivity();
    else { if (view === 'record') view = 'today'; v.innerHTML = renderToday(); }
  }

  function taskRow(r) {
    const b = bucket(r);
    const cls = b === 'missed' ? 'missed' : b === 'late' ? 'late' : b === 'today' ? 'today' : '';
    const dueTxt = b === 'missed' ? 'Waiting on you' : b === 'waiting' ? 'Waiting on them' : rel(r.due);
    const last = r.lastSnippet ? `<div class="lastline">Last: ${r.lastFrom === 'them' ? 'they' : 'you'} wrote ${esc(fmt(r.lastAt))}${r.lastSource ? ' by ' + esc(r.lastSource) : ''}: "${esc(r.lastSnippet)}"</div>` : '';
    const cl = convLink(r);
    return `<div class="task ${cls}">
      <div class="trow"><button class="link" data-open="${esc(r.id)}">${esc(r.name)}</button><span class="muted">${esc(r.org || '')}</span>${pills(r)}<span class="due ${b === 'late' ? 'late' : ''}">${esc(dueTxt)}</span></div>
      <div class="next">${esc(r.next || 'No next step set')}</div>${last}
      <div class="acts">
        ${reach(r)}
        ${r.say ? `<button class="btn" data-copy-say="${esc(r.id)}">Copy message</button>` : ''}
        ${r.email ? `<a class="btn" href="mailto:${esc(r.email)}">Email</a>` : ''}
        ${cl ? `<a class="btn" href="${esc(cl)}" target="_blank" rel="noopener">Open conversation</a>` : ''}
        <button class="btn primary" data-log="${esc(r.id)}" data-done="1">Done</button>
        <button class="btn ghost" data-snooze="${esc(r.id)}" data-days="1">Tomorrow</button>
        <button class="btn ghost" data-snooze="${esc(r.id)}" data-days="7">Next week</button>
      </div></div>`;
  }
  function renderToday() {
    const vis = rows.filter((r) => typeOk(r) && matches(r));
    const g = (b) => vis.filter((r) => bucket(r) === b).sort((a, c) => (a.prio || 5) - (c.prio || 5) || String(a.due || '').localeCompare(String(c.due || '')));
    const missed = g('missed'), late = g('late'), tday = g('today'), week = g('week'), waiting = g('waiting');
    const open = rows.filter((r) => ['talking', 'meeting', 'trial'].includes(r.stage)).length;
    const paying = rows.filter((r) => r.group === 'customer' && r.stage === 'active').length;
    const recent = [];
    rows.forEach((r) => acts(r).filter((a) => a.type !== 'note' && a.type !== 'stage').slice(0, 3).forEach((a) => recent.push(Object.assign({ r }, a))));
    recent.sort((x, y) => String(y.at || '').localeCompare(String(x.at || '')));
    const sec = (title, list, empty) => `<section class="panel"><h3>${title} <span class="n">${list.length}</span></h3>${list.length ? list.map(taskRow).join('') : `<div class="empty">${empty}</div>`}</section>`;
    const hello = new Date().getHours() < 12 ? 'Good morning' : new Date().getHours() < 17 ? 'Good afternoon' : 'Good evening';
    return `<h1 class="page">${hello}, JohnMark</h1>
      <p class="lede">${missed.length + late.length + tday.length ? `${missed.length + late.length + tday.length} people need you today. Start at the top.` : 'Nobody is waiting on you right now.'}</p>
      <div class="kpis">
        <button class="kpi hot" data-jump="missed"><b>${missed.length}</b><small>Waiting on you</small></button>
        <button class="kpi late" data-jump="late"><b>${late.length}</b><small>Overdue</small></button>
        <button class="kpi" data-jump="today"><b>${tday.length}</b><small>Due today</small></button>
        <button class="kpi" data-jump="week"><b>${week.length}</b><small>Next 7 days</small></button>
        <button class="kpi" data-goto="pipeline"><b>${open}</b><small>Active deals</small></button>
        <button class="kpi" data-goto="contacts" data-type="customer"><b>${paying}</b><small>Active customers</small></button>
      </div>
      ${typeChips()}
      <div class="cols" style="margin-top:14px">
        <div class="stack">
          <div id="sec-missed">${sec("They're waiting on you", missed, 'No one has written back without an answer.')}</div>
          <div id="sec-late">${sec('Overdue', late, 'Nothing overdue.')}</div>
          <div id="sec-today">${sec('Due today', tday, 'Nothing else due today.')}</div>
          <div id="sec-week">${sec('Next 7 days', week, 'Nothing else this week.')}</div>
        </div>
        <div class="stack">
          <section class="panel"><h3>Waiting on them <span class="n">${waiting.length}</span></h3>
            ${waiting.length ? waiting.map((r) => `<div class="mini"><button class="link" data-open="${esc(r.id)}">${esc(r.name)}</button><span class="t">${esc(r.next || '')}</span></div>`).join('') : '<div class="empty">Nobody.</div>'}</section>
          <section class="panel"><h3>Recent activity <span class="right"><button class="btn ghost" data-goto="activity">See all</button></span></h3>
            ${recent.slice(0, 8).map((a) => `<div class="mini"><span class="pill">${esc(ACT[a.type] || a.type)}</span><button class="link" data-open="${esc(a.r.id)}">${esc(a.r.name)}</button><span class="t">${esc(ago(a.at))}</span></div>`).join('') || '<div class="empty">No activity yet.</div>'}</section>
        </div>
      </div>`;
  }
  function typeChips() {
    const opts = [['all', 'Everyone']].concat(Object.entries(TYPES).filter(([k]) => rows.some((r) => (r.group || 'other') === k)));
    return `<div class="chips" role="group" aria-label="Type">${opts.map(([k, l]) => `<button class="chip" data-type-f="${k}" aria-pressed="${typeF === k}">${esc(l)}</button>`).join('')}</div>`;
  }
  function renderContacts() {
    let list = rows.filter((r) => typeOk(r) && matches(r) && (stageF === 'all' || r.stage === stageF));
    const key = { name: (r) => (r.name || '').toLowerCase(), org: (r) => (r.org || '').toLowerCase(), group: (r) => r.group || '', stage: (r) => STAGES.findIndex(([k]) => k === r.stage),
      next: (r) => (r.next || '').toLowerCase(), due: (r) => (r.state === 'done' ? '9999' : r.due || '9998'), touch: (r) => lastTouch(r) || '', channel: (r) => r.channel || '' }[sortK];
    list.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
    const th = (k, l) => `<th data-sort="${k}" aria-sort="${sortK === k ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'}">${l}</th>`;
    return `<h1 class="page">Contacts</h1><p class="lede">${list.length} of ${rows.length} people${q ? ` matching "${esc(q)}"` : ''}. Click anyone to open their record.</p>
      <div class="toolbar">${typeChips()}
        <select id="stageF" aria-label="Stage"><option value="all">All stages</option>${STAGES.map(([k, l]) => `<option value="${k}" ${stageF === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="panel tablewrap"><table><thead><tr>${th('name', 'Name')}${th('org', 'Company')}${th('group', 'Type')}${th('stage', 'Stage')}${th('next', 'Next step')}${th('due', 'Next date')}${th('touch', 'Last touch')}${th('channel', 'Reach by')}</tr></thead>
      <tbody>${list.slice(0, shown).map((r) => { const b = bucket(r); return `<tr data-open="${esc(r.id)}">
        <td><button class="link" data-open="${esc(r.id)}">${esc(r.name)}</button><span class="sub">${esc(r.title || '')}</span></td>
        <td>${esc(r.org || '')}</td><td><span class="pill ${esc(r.group || 'other')}">${esc(TYPES[r.group] || 'Other')}</span></td>
        <td>${esc(STAGE[r.stage] || '')}</td><td class="nx">${esc(r.next || '')}</td>
        <td class="num ${b === 'late' ? 'due late' : ''}">${b === 'missed' ? '<b>Waiting on you</b>' : r.state === 'done' ? '<span class="muted">None</span>' : r.state === 'waiting' ? 'Waiting on them' : esc(rel(r.due))}</td>
        <td class="num">${esc(ago(lastTouch(r)))}</td><td>${esc(CH[r.channel] || '')}</td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">No one matches.</td></tr>'}</tbody></table></div>
      ${list.length > shown ? `<p style="margin-top:12px"><button class="btn" id="moreRows">Show ${Math.min(200, list.length - shown)} more</button> <span class="muted">${shown} of ${list.length} shown. Search or filter to narrow it.</span></p>` : ''}`;
  }
  function renderPipeline() {
    const list = rows.filter((r) => typeOk(r) && matches(r));
    return `<h1 class="page">Pipeline</h1><p class="lede">Drag a card to move someone to a new stage, or click it to open the record.</p>
      <div class="toolbar">${typeChips()}</div>
      <div class="board">${STAGES.map(([k, l]) => { const c = list.filter((r) => (r.stage || 'new') === k).sort((a, b) => (a.prio || 5) - (b.prio || 5));
        return `<div class="lane" data-lane="${k}"><h4>${l}<span class="muted">${c.length}</span></h4><div class="cards">${c.slice(0, 40).map((r) => `
          <div class="dcard" draggable="true" data-drag="${esc(r.id)}" data-open="${esc(r.id)}" tabindex="0">
            <div class="nm">${esc(r.name)}</div><div class="og">${esc(r.org || '')}</div>
            <div class="nx">${esc(r.next || '')}</div>
            <div class="ft"><span class="pill ${esc(r.group || 'other')}">${esc(TYPES[r.group] || 'Other')}</span><span class="due ${bucket(r) === 'late' ? 'late' : ''}">${bucket(r) === 'missed' ? 'Waiting on you' : r.state === 'done' ? '' : esc(rel(r.due))}</span></div>
          </div>`).join('')}${c.length > 40 ? `<button class="btn ghost" data-goto="contacts" data-stage-f="${k}">+ ${c.length - 40} more in Contacts</button>` : ''}</div></div>`; }).join('')}</div>`;
  }
  function timeline(items, withName) {
    if (!items.length) return '<div class="empty">No activity logged yet.</div>';
    let out = '', day = '';
    items.forEach((a) => {
      const d = (a.at || '').slice(0, 10);
      if (d !== day) { day = d; out += `<div class="day">${esc(d ? fmt(d, true) : 'Undated')}</div>`; }
      out += `<div class="ev"><div class="ico ${esc(a.type)}">${esc(ICON[a.type] || '•')}</div><div>
        <div class="hd"><b>${esc(ACT[a.type] || a.type)}</b>${withName ? ` <button class="link" data-open="${esc(a.r.id)}">${esc(a.r.name)}</button> <span class="muted">${esc(a.r.org || '')}</span>` : ''}</div>
        <div class="tx">${esc(a.text || '')}</div></div></div>`;
    });
    return out;
  }
  function renderActivity() {
    const all = [];
    rows.filter((r) => typeOk(r) && matches(r)).forEach((r) => acts(r).forEach((a) => all.push(Object.assign({ r }, a))));
    all.sort((x, y) => String(y.at || '').localeCompare(String(x.at || '')));
    const kinds = ['all', 'call', 'meeting', 'email', 'text', 'linkedin', 'inbound', 'note'];
    const list = all.filter((a) => actF === 'all' || a.type === actF);
    return `<h1 class="page">Activity</h1><p class="lede">Every call, meeting, email and message across everyone, newest first.</p>
      <div class="toolbar">${typeChips()}</div>
      <div class="toolbar"><div class="chips">${kinds.map((k) => `<button class="chip" data-act-f="${k}" aria-pressed="${actF === k}">${k === 'all' ? 'All activity' : esc(ACT[k])}</button>`).join('')}</div></div>
      <div class="panel">${timeline(list.slice(0, 400), true)}</div>`;
  }
  function renderRecord(r) {
    const b = bucket(r), si = STAGES.findIndex(([k]) => k === (r.stage || 'new'));
    const cl = convLink(r);
    const dueTxt = b === 'missed' ? 'They are waiting on you' : r.state === 'done' ? 'No follow-up set' : r.state === 'waiting' ? 'Waiting on them' + (r.due ? ', check back ' + rel(r.due) : '') : (r.due ? (Math.abs(daysFrom(r.due)) < 7 ? rel(r.due) + ' · ' : '') + fmt(r.due, true) : 'No date set');
    const det = [['Name', r.name], ['Title', r.title], ['Company', r.org], ['Type', TYPES[r.group] || 'Other'], ['Stage', STAGE[r.stage] || ''], ['Best way', CH[r.channel] || ''],
      ['Email', r.email, 1], ['Phone', r.phone, 1], ['LinkedIn', r.linkedin, 2], ['Value', +r.value > 0 ? '$' + r.value + '/mo' : ''], ['Source', r.source], ['Other handle', r.handle && r.handle !== r.email && r.handle !== r.phone ? r.handle : '', 1], ['Updated', r.updatedAt ? fmt(r.updatedAt, true) : '']]
      .filter(([, v], i) => v || i < 6);
    return `<div class="crumb"><button class="link" data-goto="contacts">Contacts</button> › ${esc(r.name)}</div>
      <section class="panel">
        <div class="rhead"><div class="avatar">${esc(initials(r.name))}</div>
          <div><h1>${esc(r.name)}</h1><div class="who">${esc([r.title, r.org].filter(Boolean).join(' · '))}</div><div style="margin-top:6px">${pills(r)}</div></div>
          <div class="btns">
            <button class="btn" data-log="${esc(r.id)}" data-type="call">Log a call</button>
            <button class="btn" data-log="${esc(r.id)}" data-type="meeting">Log a meeting</button>
            <button class="btn" data-log="${esc(r.id)}" data-type="inbound">They replied</button>
            <button class="btn" data-edit="${esc(r.id)}">Edit</button>
          </div></div>
        <div class="highlights">
          <div><small>Next step</small><span>${esc(dueTxt)}</span></div>
          <div><small>Reach by</small><span>${esc(CH[r.channel] || '—')}</span></div>
          <div><small>Email</small><span>${esc(r.email || '—')}</span></div>
          <div><small>Phone</small><span>${esc(r.phone || '—')}</span></div>
          <div><small>Last touch</small><span>${esc(lastTouch(r) ? fmt(lastTouch(r), true) : '—')}</span></div>
          <div><small>Value</small><span>${+r.value > 0 ? '$' + esc(r.value) + '/mo' : '—'}</span></div>
        </div>
      </section>
      <div class="path" role="group" aria-label="Stage">${STAGES.map(([k, l], i) => `<button class="step ${k} ${i === si ? 'cur' : (i < si && r.stage !== 'parked' && k !== 'parked') ? 'past' : ''}" data-stage="${k}" data-id="${esc(r.id)}" aria-pressed="${i === si}">${l}</button>`).join('')}</div>
      <div class="rcols">
        <div class="stack">
          <section class="panel nextbox"><h3>Next step <span class="right">${b === 'late' ? '<span class="pill" style="color:var(--late)">Overdue</span>' : b === 'missed' ? '<span class="pill" style="color:var(--info)">Waiting on you</span>' : ''}</span></h3><div class="body">
            <div class="what">${esc(r.next || 'No next step set')}</div><div class="when">${esc(dueTxt)}</div>
            ${r.lastSnippet ? `<div class="lastline" style="margin-top:6px">Last: ${r.lastFrom === 'them' ? 'they' : 'you'} wrote ${esc(fmt(r.lastAt))}${r.lastSource ? ' by ' + esc(r.lastSource) : ''}: "${esc(r.lastSnippet)}"</div>` : ''}
            ${r.say ? `<div class="say"><small>Message ready to send</small>${esc(r.say)}</div>` : ''}
            <div class="acts" style="margin-top:10px">
              ${reach(r)}
              ${r.email ? `<a class="btn" href="mailto:${esc(r.email)}">Email</a>` : ''}
              ${r.say ? `<button class="btn" data-copy-say="${esc(r.id)}">Copy message</button>` : ''}
              ${handleOf(r) ? `<button class="btn" data-copy-text="${esc(handleOf(r))}">Copy ${esc(r.channel === 'email' ? 'email' : r.channel === 'linkedin' ? 'link' : 'number')}</button>` : ''}
              ${cl ? `<a class="btn" href="${esc(cl)}" target="_blank" rel="noopener">Open conversation</a>` : ''}
              <button class="btn primary" data-log="${esc(r.id)}" data-done="1">Done</button>
              <button class="btn ghost" data-snooze="${esc(r.id)}" data-days="1">Tomorrow</button>
              <button class="btn ghost" data-snooze="${esc(r.id)}" data-days="7">Next week</button>
              ${r.due && r.state !== 'done' ? `<a class="btn ghost" href="${API}/contacts/${encodeURIComponent(r.id)}/followup.ics">Add to calendar</a>` : ''}
            </div></div></section>
          ${mailPanel(r)}
          <section class="panel"><h3>Activity <span class="n">${acts(r).length}</span></h3>
            <form class="composer" id="quickLog" data-id="${esc(r.id)}">
              <select name="type" aria-label="Type">${['call', 'text', 'email', 'linkedin', 'meeting', 'inbound', 'note'].map((k) => `<option value="${k}" ${k === (r.channel || 'text') ? 'selected' : ''}>${ACT[k]}</option>`).join('')}</select>
              <input type="date" name="at" value="${today()}" aria-label="Date">
              <span class="slot"></span>
              <textarea name="text" placeholder="Log what happened: what you said, what they said, what's agreed" aria-label="Details"></textarea>
              <div class="row"><button class="btn primary" type="submit">Log it</button><span class="muted" style="font-size:12px">Use Done above to also set the next step.</span></div>
            </form>
            ${timeline(acts(r), false)}</section>
        </div>
        <div class="stack">
          <section class="panel"><h3>Details <span class="right"><button class="btn ghost" data-edit="${esc(r.id)}">Edit</button></span></h3>
            <dl class="det">${det.map(([k, v, c]) => `<dt>${k}</dt><dd><span>${c === 2 && /^https:/.test(v || '') ? `<a href="${esc(v)}" target="_blank" rel="noopener">Profile</a>` : esc(v || '—')}</span>${c && v ? `<button class="copy" data-copy-text="${esc(v)}">Copy</button>` : ''}</dd>`).join('')}</dl></section>
          <section class="panel notes"><h3>Notes <span class="right"><span class="saved" id="notesSaved"></span><button class="btn" id="saveNotes" data-id="${esc(r.id)}">Save</button></span></h3>
            <textarea id="notesBox" aria-label="Notes" placeholder="Everything worth remembering about this person">${esc(r.notes || '')}</textarea></section>
        </div>
      </div>`;
  }

  const mailPanel = () => '', loadMail = () => {}, sendMail = () => {};

  // ---------- Actions ----------
  function go(v, extra) {
    view = v; if (v === 'record') recId = extra; else try { localStorage.setItem('crm-view', v); } catch (_) {}
    render(); window.scrollTo(0, 0);
    if (v === 'record' && mailOk && !mail[extra]) { const r = byId(extra); if (r && r.email) loadMail(r); }
  }
  async function setStage(id, stage) {
    const r = byId(id); if (!r || r.stage === stage) return;
    const activity = (Array.isArray(r.activity) ? r.activity.slice(-199) : []).concat([{ at: new Date().toISOString(), type: 'stage', text: (STAGE[r.stage] || 'None') + ' → ' + STAGE[stage] }]);
    if (await save(id, { stage, activity })) toast('Moved to ' + STAGE[stage]);
  }
  function fillSelect(sel, pairs) { sel.innerHTML = pairs.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join(''); }
  fillSelect(document.querySelector('#editForm [name=group]'), Object.entries(TYPES));
  fillSelect(document.querySelector('#editForm [name=stage]'), STAGES);
  fillSelect(document.querySelector('#logForm [name=type]'), ['call', 'text', 'email', 'linkedin', 'meeting', 'inbound', 'note'].map((k) => [k, ACT[k]]));

  function openEdit(r) {
    editing = r || null; delArm = false;
    const f = $('editForm');
    $('editTitle').textContent = r ? 'Edit ' + r.name : 'New contact';
    const d = r || { group: 'prospect', stage: 'new', channel: 'text', state: 'open', due: addDays(1) };
    ['name', 'title', 'org', 'group', 'stage', 'channel', 'email', 'phone', 'linkedin', 'link', 'value', 'source', 'next', 'due', 'state', 'say'].forEach((k) => { f.elements[k].value = d[k] == null ? '' : d[k]; });
    if (!f.elements.stage.value) f.elements.stage.value = 'new';
    $('delBtn').hidden = !r; $('delBtn').textContent = 'Remove';
    $('editDlg').showModal();
  }
  $('editDlg').addEventListener('close', async () => {
    if ($('editDlg').returnValue !== 'save') return;
    const f = $('editForm'), body = {};
    ['name', 'title', 'org', 'group', 'stage', 'channel', 'email', 'phone', 'linkedin', 'link', 'source', 'next', 'due', 'state', 'say'].forEach((k) => { body[k] = f.elements[k].value.trim(); });
    body.value = f.elements.value.value ? Number(f.elements.value.value) : 0;
    if (!body.name) return;
    if (editing) {
      if (body.stage !== editing.stage) body.activity = (editing.activity || []).concat([{ at: new Date().toISOString(), type: 'stage', text: (STAGE[editing.stage] || 'None') + ' → ' + STAGE[body.stage] }]);
      if (await save(editing.id, body)) toast('Saved');
    } else {
      try { const out = await api('POST', '/contacts', Object.assign(body, { prio: 2 }));
        toast('Added'); await load(); if (out.contact && out.contact.id) { recId = out.contact.id; view = 'record'; } render(); } catch (e) { toast('Could not add. Try again.'); }
    }
  });
  $('delBtn').addEventListener('click', async () => {
    if (!editing) return;
    if (!delArm) { delArm = true; $('delBtn').textContent = 'Tap again to remove for good'; return; }
    $('editDlg').close('cancel');
    try { await api('PATCH', '/contacts/' + encodeURIComponent(editing.id), { archived: true }); toast('Removed'); await load(); go('contacts'); } catch (e) { toast('Could not remove.'); }
  });

  function openLog(r, type, done) {
    logging = r; const f = $('logForm');
    $('logTitle').textContent = (done ? 'Done: ' : 'Log activity: ') + r.name;
    f.elements.type.value = type || (done ? (r.channel === 'call' ? 'call' : r.channel || 'text') : 'call');
    f.elements.at.value = today();
    f.elements.text.value = done ? (r.say ? 'Sent: ' + r.say : (r.next || '')) : '';
    f.elements.next.value = type === 'inbound' ? 'Reply to ' + (r.name || '').split(' ')[0] : (done ? '' : (r.next || ''));
    f.elements.when.value = type === 'inbound' ? '0' : done ? '7' : 'keep';
    f.elements.due.value = r.due || addDays(7);
    $('logDlg').showModal();
  }
  $('logDlg').addEventListener('close', async () => {
    if ($('logDlg').returnValue !== 'save' || !logging) return;
    const r = logging, f = $('logForm'), type = f.elements.type.value, at = f.elements.at.value || today(), text = f.elements.text.value.trim();
    const patch = { activity: (Array.isArray(r.activity) ? r.activity.slice(-199) : []).concat([{ at, type, text }]), next: f.elements.next.value.trim() };
    if (type === 'inbound') Object.assign(patch, { lastFrom: 'them', lastAt: at, lastSource: CH[r.channel] || 'message', lastSnippet: text.slice(0, 140) });
    else if (type !== 'note') Object.assign(patch, { lastFrom: 'me', lastAt: at, lastSource: ACT[type].toLowerCase(), lastSnippet: text.slice(0, 140) });
    const w = f.elements.when.value;
    if (w === 'close') Object.assign(patch, { state: 'done' });
    else if (w === 'waiting') Object.assign(patch, { state: 'waiting', due: addDays(7) });
    else if (w === 'date') Object.assign(patch, { state: 'open', due: f.elements.due.value || addDays(7) });
    else if (w !== 'keep') Object.assign(patch, { state: 'open', due: addDays(+w) });
    if (type === 'meeting' && ['new', 'reached', 'talking'].includes(r.stage)) { patch.stage = 'meeting'; }
    if (await save(r.id, patch)) toast('Logged');
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, tr[data-open], .dcard, a'); if (!t) return;
    if (t.tagName === 'A') return;
    const d = t.dataset;
    if (d.q) { const Q = { no_answer: ['call', 'Called. No answer.', '1'], voicemail: ['call', 'Called. Left a voicemail.', '2'], talked: ['call', 'Talked on the phone. ', '7'], texted: ['text', 'Texted. ', '2'], emailed: ['email', 'Emailed. ', '7'] }[d.q];
      const f = $('logForm'); f.elements.type.value = Q[0]; f.elements.text.value = Q[1]; f.elements.when.value = Q[2]; if (!f.elements.next.value && logging) f.elements.next.value = logging.next || 'Follow up'; f.elements.text.focus(); return; }
    if (d.view) { q = ''; $('q').value = ''; return go(d.view); }
    if (d.goto) { if (d.type) { typeF = d.type; } if (d.stageF) { stageF = d.stageF; } return go(d.goto); }
    if (d.open && !d.copySay) return go('record', d.open);
    if (d.typeF) { typeF = d.typeF; try { localStorage.setItem('crm-type', typeF); } catch (_) {} return render(); }
    if (d.actF) { actF = d.actF; return render(); }
    if (d.sort) { if (sortK === d.sort) sortDir *= -1; else { sortK = d.sort; sortDir = 1; } return render(); }
    if (d.jump) { const el = $('sec-' + d.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (d.copySay) { const r = byId(d.copySay); if (r) copy(r.say); return; }
    if (d.copyText) return copy(d.copyText);
    if (d.log) { const r = byId(d.log); if (r) openLog(r, d.type, !!d.done); return; }
    if (d.edit) { const r = byId(d.edit); if (r) openEdit(r); return; }
    if (d.loadMail) { const r = byId(d.loadMail); if (r) loadMail(r); return; }
    if (d.compose) { go('record', d.compose); setTimeout(() => { const p = $('emailPanel'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); const f = $('mailForm'); if (f) f.elements.subject.focus({ preventScroll: true }); }, 60); return; }
    if (d.snooze) { save(d.snooze, { due: addDays(+d.days), state: 'open' }).then((ok) => ok && toast('Moved to ' + rel(addDays(+d.days)))); return; }
    if (d.stage && d.id) return setStage(d.id, d.stage);
    if (t.id === 'saveNotes') { saveNotes(t.dataset.id); return; }
    if (t.id === 'moreRows') { shown += 200; return render(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('dcard')) go('record', e.target.dataset.open);
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'stageF') { stageF = e.target.value; render(); } });
  document.addEventListener('submit', async (e) => {
    if (e.target.id === 'mailForm') { e.preventDefault(); const r = byId(e.target.dataset.id); if (r && mcp && !(mail[r.id] || {}).sending) sendMail(r, e.target); return; }
    if (e.target.id !== 'quickLog') return; e.preventDefault();
    const f = e.target, r = byId(f.dataset.id); if (!r) return;
    const type = f.elements.type.value, at = f.elements.at.value || today(), text = f.elements.text.value.trim(); if (!text) { f.elements.text.focus(); return; }
    const patch = { activity: (Array.isArray(r.activity) ? r.activity.slice(-199) : []).concat([{ at, type, text }]) };
    if (type === 'inbound') Object.assign(patch, { lastFrom: 'them', lastAt: at, lastSource: CH[r.channel] || 'message', lastSnippet: text.slice(0, 140) });
    else if (type !== 'note') Object.assign(patch, { lastFrom: 'me', lastAt: at, lastSource: ACT[type].toLowerCase(), lastSnippet: text.slice(0, 140) });
    if (await save(r.id, patch)) toast('Logged');
  });
  let notesDirty = false;
  document.addEventListener('input', (e) => {
    if (e.target.id === 'notesBox') { notesDirty = true; $('notesSaved').textContent = 'Unsaved'; }
    const f = e.target.form; if (f && f.id === 'mailForm') { const d = drafts[f.dataset.id]; if (d && e.target.name in d) d[e.target.name] = e.target.value; }
  });
  document.addEventListener('change', (e) => { const f = e.target.form; if (f && f.id === 'mailForm' && e.target.name === 'follow') { const d = drafts[f.dataset.id]; if (d) d.follow = e.target.value; } });
  document.addEventListener('focusout', (e) => { if (e.target.id === 'notesBox' && notesDirty) saveNotes($('saveNotes').dataset.id); });
  async function saveNotes(id) { const box = $('notesBox'); if (!box) return; notesDirty = false; if (await save(id, { notes: box.value })) { const s = $('notesSaved'); if (s) s.textContent = 'Saved'; } }

  let dragId = null;
  document.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('.dcard'); if (c) { dragId = c.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} } });
  document.addEventListener('dragover', (e) => { const l = e.target.closest && e.target.closest('.lane'); if (l && dragId) { e.preventDefault(); document.querySelectorAll('.lane.over').forEach((x) => x !== l && x.classList.remove('over')); l.classList.add('over'); } });
  document.addEventListener('drop', (e) => { const l = e.target.closest && e.target.closest('.lane'); document.querySelectorAll('.lane.over').forEach((x) => x.classList.remove('over')); if (l && dragId) { e.preventDefault(); setStage(dragId, l.dataset.lane); } dragId = null; });
  document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.lane.over').forEach((x) => x.classList.remove('over')); });

  $('q').addEventListener('input', (e) => { q = e.target.value.trim(); if (q && (view === 'today' || view === 'record')) view = 'contacts'; render(); });
  $('newBtn').addEventListener('click', () => openEdit(null));

  // Re-render without clobbering text the user is typing in the record page.
  function safeRender(force) {
    const a = document.activeElement;
    if (!force && a && (a.id === 'notesBox' || (a.form && (a.form.id === 'quickLog' || (a.form.id === 'mailForm' && a.tagName !== 'BUTTON'))))) return;
    render();
  }

  render();
  load();
  // Pick up anything logged from another device, without touching what he is typing.
  setInterval(() => { if (!document.querySelector('dialog[open]')) load(); }, 2 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('dialog[open]')) load(); });
  setInterval(safeRender, 30 * 60 * 1000);
})();
</script>
</body>
</html>
