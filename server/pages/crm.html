<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NILDash CRM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0C">
<link rel="manifest" href="/crm.webmanifest">
<link rel="apple-touch-icon" href="/crm-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM">
<style>
:root{--bg:#0A0A0C;--card:#141417;--card2:#1B1B20;--line:#2A2A30;--text:#F4F4F2;--muted:#A1A1A6;--accent:#C8F135;--ink:#0A0A08;--red:#F87171;--amber:#FBBF24;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)) 0;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin-top:calc(-1 * env(safe-area-inset-top))}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:1px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:600}
h2 .n{color:var(--text)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;min-height:44px}
.btn.go{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;min-height:38px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.over{border-color:rgba(248,113,113,.45)}
.nm{font-weight:650;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nm .org{font-weight:500;color:var(--muted);font-size:13.5px}
.next{margin:6px 0 2px;font-size:15px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.meta .late{color:var(--red);font-weight:600}
.meta .soon{color:var(--amber);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.pill.p1{color:var(--accent);border-color:rgba(200,241,53,.35)}
.empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,15,18,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{background:none;border:0;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);min-height:48px}
nav.tabs button.on{color:var(--ink);background:var(--accent)}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:92px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button.on{color:var(--ink);background:var(--text);border-color:var(--text)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outs button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:13px 10px;font-weight:600;font-size:15px;min-height:50px}
.outs button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600}
.quick button.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.page{display:none}
.page.on{display:block}
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;overflow:auto;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.detail.open{display:block}
.detail .bar{position:sticky;top:0;background:rgba(10,10,12,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0;z-index:2}
.detail .bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.say{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:15px}
.tl{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px}
.tl .it{margin:0 0 14px;position:relative}
.tl .it:before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl .it.in:before{background:var(--accent)}
.tl .when{font-size:12px;color:var(--muted)}
.tl .x{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 0;text-decoration:underline}
.err{color:var(--red);font-size:14px;margin-top:10px;display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--text);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;display:none;max-width:90vw}
a{color:var(--accent)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14.5px}
.kv .k{color:var(--muted)}
.kv .v{overflow-wrap:anywhere}
@media (min-width:720px){.sheet{align-items:center}.sheet .box{border-radius:18px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>CRM<small id="hdSub">Loading...</small></h1>
  <button class="btn go sm" id="addBtn" type="button">Add contact</button>
</div></header>

<main class="wrap">
  <section class="page on" id="pg-today"></section>
  <section class="page" id="pg-contacts">
    <div style="padding-top:14px"><input type="search" id="q" placeholder="Search name, company, notes" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div id="contactList" style="margin-top:10px"></div>
  </section>
  <section class="page" id="pg-more"></section>
</main>

<nav class="tabs"><div class="wrap">
  <button type="button" data-tab="today" class="on">Today</button>
  <button type="button" data-tab="contacts">Contacts</button>
  <button type="button" data-tab="more">More</button>
</div></nav>

<div class="detail" id="detail"></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var S = { meta: null, today: null, contacts: [], filter: 'all', q: '', open: null };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function api(method, url, body) {
    return fetch('/api/admin/crm' + url, { method: method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) { signedOut(); throw new Error('signed out'); }
        return r.json().then(function (d) { if (!r.ok) throw new Error((d && d.error) || 'Something went wrong.'); return d; });
      });
  }
  function signedOut() {
    document.querySelector('main').textContent = '';
    document.querySelector('main').appendChild(el('div', { class: 'empty' }, [
      el('div', { text: 'Sign in to NILDash with your admin account, then open this again.' }),
      el('div', { style: 'margin-top:14px' }, [el('a', { class: 'btn go', href: '/app', text: 'Sign in', style: 'text-decoration:none;display:inline-block' })])
    ]));
    $('hdSub').textContent = 'Signed out';
  }
  function toast(t) { var x = $('toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { x.style.display = 'none'; }, 2200); }

  // ── dates, in plain words ──
  function ymdAdd(ymd, n) { var d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dayName(ymd) { return new Date(ymd + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
  function t12(hhmm) { if (!hhmm) return ''; var p = hhmm.split(':'), h = +p[0]; return (((h + 11) % 12) + 1) + ':' + p[1] + (h < 12 ? ' am' : ' pm'); }
  function dueWords(c) {
    var t = S.today ? S.today.date : new Date().toISOString().slice(0, 10);
    if (!c.due) return null;
    var diff = Math.round((new Date(c.due + 'T12:00:00Z') - new Date(t + 'T12:00:00Z')) / 86400000);
    var w = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : diff < 0 ? (-diff) + ' days overdue' : dayName(c.due);
    return { text: w + (c.dueTime ? ' at ' + t12(c.dueTime) : ''), cls: diff < 0 ? 'late' : diff === 0 ? 'soon' : '' };
  }
  function ago(iso) {
    if (!iso) return '';
    var d = (Date.now() - new Date(iso).getTime()) / 86400000;
    if (d < 1) return 'today'; if (d < 2) return 'yesterday'; if (d < 14) return Math.floor(d) + ' days ago'; if (d < 60) return Math.floor(d / 7) + ' weeks ago';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function stamp(iso) { return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  var digits = function (p) { return String(p || '').replace(/[^\d+]/g, ''); };

  // ── a contact card (Today and Contacts) ──
  function card(c, opts) {
    var due = dueWords(c);
    var meta = el('div', { class: 'meta' });
    if (due) meta.appendChild(el('span', { class: due.cls, text: due.text }));
    if (c.lastTouch) meta.appendChild(document.createTextNode((due ? '  ·  ' : '') + 'Last: ' + c.lastTouch.text.slice(0, 70) + ' (' + ago(c.lastTouch.at) + ')'));
    else if (!due) meta.appendChild(document.createTextNode('No follow-up set'));
    var nm = el('div', { class: 'nm' }, [el('span', { text: c.name }), c.org ? el('span', { class: 'org', text: c.org }) : null,
      c.prio === 1 ? el('span', { class: 'pill p1', text: 'Top' }) : null]);
    var row = el('div', { class: 'row' });
    if (c.phone) {
      row.appendChild(el('a', { class: 'btn sm', href: 'tel:' + digits(c.phone), text: 'Call', style: 'text-decoration:none;color:inherit' }));
      row.appendChild(el('a', { class: 'btn sm', href: 'sms:' + digits(c.phone), text: 'Text', style: 'text-decoration:none;color:inherit' }));
    }
    row.appendChild(el('button', { class: 'btn sm go', type: 'button', text: 'Log', onclick: function (e) { e.stopPropagation(); openLog(c); } }));
    var box = el('div', { class: 'card' + (opts && opts.over ? ' over' : ''), role: 'button', tabindex: '0', onclick: function () { openDetail(c.id); } },
      [nm, c.next ? el('div', { class: 'next', text: c.next }) : null, meta, row]);
    row.addEventListener('click', function (e) { e.stopPropagation(); });
    return box;
  }

  // ── Today ──
  function renderToday() {
    var p = $('pg-today'); p.textContent = '';
    var t = S.today; if (!t) return;
    var n = t.overdue.length + t.today.length;
    $('hdSub').textContent = n ? n + ' to follow up today' : 'Nothing due today';
    function sec(title, rows, over) {
      if (!rows.length) return;
      p.appendChild(el('h2', null, [title + ' ', el('span', { class: 'n', text: String(rows.length) })]));
      rows.forEach(function (c) { p.appendChild(card(c, { over: over })); });
    }
    sec('Overdue', t.overdue, true);
    sec('Today', t.today, false);
    if (!n) p.appendChild(el('div', { class: 'empty', text: 'You are caught up. Nothing is due today.' }));
    sec('Next 7 days', t.upcoming, false);
    if (t.counts && t.counts.noNextStep) p.appendChild(el('div', { class: 'meta', style: 'text-align:center;margin:18px 0', text: t.counts.noNextStep + ' open contact' + (t.counts.noNextStep === 1 ? ' has' : 's have') + ' no follow-up date. See Contacts, filter "No date".' }));
  }

  // ── Contacts ──
  function renderFilters() {
    var f = $('filters'); f.textContent = '';
    var opts = [['all', 'All'], ['nodate', 'No date']].concat((S.meta.groups || []).map(function (g) { return [g, g.charAt(0).toUpperCase() + g.slice(1)]; }));
    opts.forEach(function (o) {
      f.appendChild(el('button', { type: 'button', class: S.filter === o[0] ? 'on' : '', text: o[1], onclick: function () { S.filter = o[0]; renderFilters(); renderContacts(); } }));
    });
  }
  function renderContacts() {
    var box = $('contactList'); box.textContent = '';
    var q = S.q.toLowerCase();
    var rows = S.contacts.filter(function (c) {
      if (S.filter === 'nodate') { if (c.due || c.state === 'done' || c.stage === 'parked') return false; }
      else if (S.filter !== 'all' && c.group !== S.filter) return false;
      if (!q) return true;
      return [c.name, c.org, c.title, c.notes, c.next, c.email, c.phone].some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; });
    });
    if (!rows.length) { box.appendChild(el('div', { class: 'empty', text: S.contacts.length ? 'No one matches.' : 'No contacts yet. Add one, or import your old list under More.' })); return; }
    rows.forEach(function (c) { box.appendChild(card(c)); });
  }

  // ── More ──
  function renderMore() {
    var p = $('pg-more'); p.textContent = '';
    p.appendChild(el('h2', { text: 'On your phone' }));
    p.appendChild(el('div', { class: 'card' }, [el('div', { text: 'To use this like an app: open this page in Safari, tap Share, then Add to Home Screen. It opens full screen from its own icon.' })]));
    p.appendChild(el('h2', { text: 'Reminders' }));
    p.appendChild(el('div', { class: 'card' }, [el('div', { text: 'Each morning at 7:30 Eastern you get an email with who to follow up with. A follow-up with a time also emails you at that time. On a contact, Add to calendar puts the follow-up on your phone’s calendar with an alert.' }),
      el('div', { class: 'meta', text: 'Reminders go to ' + ((S.meta && S.meta.alertTo) || 'your admin email') + '.' })]));
    p.appendChild(el('h2', { text: 'Import' }));
    var file = el('input', { type: 'file', id: 'importFile', accept: '.json,application/json', style: 'display:block;margin:10px 0' });
    var out = el('div', { class: 'meta', id: 'importOut' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0]; if (!f) return;
      out.textContent = 'Reading ' + f.name + '...';
      f.text().then(function (t) { return api('POST', '/import', { contacts: JSON.parse(t) }); })
        .then(function (r) { out.textContent = 'Added ' + r.added + ' contacts and ' + r.activity + ' history entries. Skipped ' + r.skipped + ' already here.'; return load(); })
        .catch(function (e) { out.textContent = 'That file could not be imported: ' + e.message; });
    });
    p.appendChild(el('div', { class: 'card' }, [el('div', { text: 'Bring contacts over from an export file. Anyone already here is left as they are.' }), file, out]));
    p.appendChild(el('div', { class: 'meta', style: 'text-align:center;margin:18px 0' }, [el('a', { href: '/app', text: 'Back to NILDash' })]));
  }

  // ── the Log sheet: one tap, then when to follow up ──
  function openLog(c) {
    var st = { outcome: null, due: null, dueTime: '', note: '', next: c.next || '', done: false, touchedDue: false };
    var box = $('sheetBox'); box.textContent = '';
    box.appendChild(el('h3', { text: 'Log: ' + c.name }));
    box.appendChild(el('div', { class: 'sub', text: 'What happened?' }));
    var outs = el('div', { class: 'outs' });
    var order = ['no_answer', 'voicemail', 'talked', 'texted', 'emailed', 'linkedin', 'met', 'they_replied', 'note'];
    var quick = el('div', { class: 'quick' });
    var dateIn = el('input', { type: 'date' }), timeIn = el('input', { type: 'time' });
    var whenLbl = el('div', { class: 'meta', style: 'margin-top:8px' });
    function setDue(d, fromUser) { st.due = d; if (fromUser) st.touchedDue = true; st.done = false; dateIn.value = d || ''; paintQuick(); }
    function paintQuick() {
      quick.textContent = '';
      var t = S.today.date;
      [['Tomorrow', ymdAdd(t, 1)], ['2 days', ymdAdd(t, 2)], ['Next week', ymdAdd(t, 7)], ['2 weeks', ymdAdd(t, 14)]].forEach(function (o) {
        quick.appendChild(el('button', { type: 'button', class: (!st.done && st.due === o[1]) ? 'on' : '', text: o[0], onclick: function () { setDue(o[1], true); } }));
      });
      quick.appendChild(el('button', { type: 'button', class: (!st.done && st.due === null && st.touchedDue) ? 'on' : '', text: 'No follow-up', onclick: function () { st.due = null; st.touchedDue = true; st.done = false; dateIn.value = ''; paintQuick(); } }));
      quick.appendChild(el('button', { type: 'button', class: st.done ? 'on' : '', text: 'Done with them', onclick: function () { st.done = true; st.due = null; st.touchedDue = true; dateIn.value = ''; paintQuick(); } }));
      whenLbl.textContent = st.done ? 'Marked done. No more follow-ups.' : st.due ? 'Follow up ' + dayName(st.due) + (timeIn.value ? ' at ' + t12(timeIn.value) : '') + '.' : 'No follow-up will be set.';
    }
    order.forEach(function (k) {
      var o = S.meta.outcomes[k]; if (!o) return;
      var b = el('button', { type: 'button', text: o.label });
      b.addEventListener('click', function () {
        st.outcome = k;
        Array.prototype.forEach.call(outs.children, function (x) { x.classList.remove('on'); }); b.classList.add('on');
        // The follow-up this kind of touch usually needs, until he picks his own.
        if (!st.touchedDue) { st.due = o.follow || null; dateIn.value = st.due || ''; paintQuick(); }
      });
      outs.appendChild(b);
    });
    box.appendChild(outs);
    box.appendChild(el('label', { for: 'logNote', text: 'Note (optional)' }));
    var note = el('textarea', { id: 'logNote', placeholder: 'What was said, or what to remember' });
    box.appendChild(note);
    box.appendChild(el('label', { text: 'Follow up' }));
    box.appendChild(quick);
    var g = el('div', { class: 'grid2', style: 'margin-top:10px' }, [el('div', null, [el('label', { text: 'Or pick a day', style: 'margin-top:0' }), dateIn]), el('div', null, [el('label', { text: 'Time (optional)', style: 'margin-top:0' }), timeIn])]);
    box.appendChild(g); box.appendChild(whenLbl);
    dateIn.addEventListener('change', function () { setDue(dateIn.value || null, true); });
    timeIn.addEventListener('change', paintQuick);
    box.appendChild(el('label', { for: 'logNext', text: 'Next step' }));
    var next = el('input', { type: 'text', id: 'logNext', value: st.next, placeholder: 'What you will do next' });
    box.appendChild(next);
    var err = el('div', { class: 'err' }); box.appendChild(err);
    var save = el('button', { class: 'btn go', type: 'button', text: 'Save', style: 'flex:1' });
    var cancel = el('button', { class: 'btn ghost', type: 'button', text: 'Cancel', onclick: closeSheet });
    box.appendChild(el('div', { class: 'row', style: 'margin-top:16px' }, [cancel, save]));
    save.addEventListener('click', function () {
      err.style.display = 'none';
      if (!st.outcome) { err.textContent = 'Pick what happened.'; err.style.display = 'block'; return; }
      var body = { outcome: st.outcome, note: note.value, next: next.value };
      if (st.done) body.done = true; else { body.due = st.due; body.dueTime = timeIn.value || null; }
      save.disabled = true; save.textContent = 'Saving...';
      api('POST', '/contacts/' + encodeURIComponent(c.id) + '/log', body).then(function () {
        closeSheet(); toast('Logged');
        return load().then(function () { if (S.open) openDetail(S.open); });
      }).catch(function (e) { save.disabled = false; save.textContent = 'Save'; err.textContent = e.message; err.style.display = 'block'; });
    });
    paintQuick();
    $('sheet').classList.add('open');
  }
  function closeSheet() { $('sheet').classList.remove('open'); }
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });

  // ── add / edit ──
  function openEdit(c) {
    var isNew = !c; c = c || { group: 'prospect', stage: 'new', prio: 2 };
    var box = $('sheetBox'); box.textContent = '';
    box.appendChild(el('h3', { text: isNew ? 'Add contact' : 'Edit ' + c.name }));
    var f = {};
    function field(key, label, type, ph) { box.appendChild(el('label', { for: 'f_' + key, text: label })); f[key] = el('input', { type: type || 'text', id: 'f_' + key, value: c[key] == null ? '' : String(c[key]), placeholder: ph || '' }); box.appendChild(f[key]); }
    function sel(key, label, list) { var s = el('select', { id: 'f_' + key }); list.forEach(function (v) { var o = el('option', { value: v[0], text: v[1] }); if (String(c[key]) === String(v[0])) o.selected = true; s.appendChild(o); }); f[key] = s; return el('div', null, [el('label', { for: 'f_' + key, text: label, style: 'margin-top:0' }), s]); }
    var cap = function (v) { return [v, v.charAt(0).toUpperCase() + v.slice(1)]; };
    field('name', 'Name'); field('org', 'Company'); field('title', 'Title');
    field('phone', 'Phone', 'tel'); field('email', 'Email', 'email'); field('linkedin', 'LinkedIn link');
    box.appendChild(el('div', { class: 'grid2', style: 'margin-top:12px' }, [sel('group', 'Type', S.meta.groups.map(cap)), sel('stage', 'Stage', S.meta.stages.map(cap))]));
    box.appendChild(el('div', { class: 'grid2', style: 'margin-top:12px' }, [sel('prio', 'Priority', [[1, 'Top'], [2, 'Normal'], [3, 'Low']]), el('div', null, [el('label', { for: 'f_value', text: 'Worth per month ($)', style: 'margin-top:0' }), (f.value = el('input', { type: 'number', id: 'f_value', inputmode: 'decimal', value: c.value == null ? '' : String(c.value) }))])]));
    field('next', 'Next step', 'text', 'What you will do next');
    var dIn = el('input', { type: 'date', value: c.due || '' }), tIn = el('input', { type: 'time', value: c.dueTime || '' });
    box.appendChild(el('div', { class: 'grid2' }, [el('div', null, [el('label', { text: 'Follow up on' }), dIn]), el('div', null, [el('label', { text: 'Time (optional)' }), tIn])]));
    box.appendChild(el('label', { for: 'f_say', text: 'What to say (your script)' })); f.say = el('textarea', { id: 'f_say' }); f.say.value = c.say || ''; box.appendChild(f.say);
    box.appendChild(el('label', { for: 'f_notes', text: 'Notes' })); f.notes = el('textarea', { id: 'f_notes', style: 'min-height:140px' }); f.notes.value = c.notes || ''; box.appendChild(f.notes);
    var err = el('div', { class: 'err' }); box.appendChild(err);
    var save = el('button', { class: 'btn go', type: 'button', text: 'Save', style: 'flex:1' });
    box.appendChild(el('div', { class: 'row', style: 'margin-top:16px' }, [el('button', { class: 'btn ghost', type: 'button', text: 'Cancel', onclick: closeSheet }), save]));
    save.addEventListener('click', function () {
      var b = { due: dIn.value || null, dueTime: tIn.value || null };
      Object.keys(f).forEach(function (k) { b[k] = f[k].value; });
      if (b.due) b.state = 'open';
      save.disabled = true; save.textContent = 'Saving...'; err.style.display = 'none';
      (isNew ? api('POST', '/contacts', b) : api('PATCH', '/contacts/' + encodeURIComponent(c.id), b)).then(function (r) {
        closeSheet(); toast('Saved');
        return load().then(function () { openDetail(r.contact.id); });
      }).catch(function (e) { save.disabled = false; save.textContent = 'Save'; err.textContent = e.message; err.style.display = 'block'; });
    });
    $('sheet').classList.add('open');
  }
  $('addBtn').addEventListener('click', function () { openEdit(null); });

  // ── one contact ──
  function openDetail(id) {
    S.open = id;
    try { history.replaceState(null, '', '#c=' + encodeURIComponent(id)); } catch (_) {}
    var d = $('detail'); d.classList.add('open'); d.textContent = '';
    d.appendChild(el('div', { class: 'wrap empty', text: 'Loading...' }));
    api('GET', '/contacts/' + encodeURIComponent(id)).then(function (c) {
      if (S.open !== id) return;
      d.textContent = '';
      d.appendChild(el('div', { class: 'bar' }, [el('div', { class: 'wrap' }, [
        el('button', { class: 'btn ghost sm', type: 'button', text: '‹ Back', onclick: closeDetail }),
        el('div', { style: 'display:flex;gap:8px' }, [el('button', { class: 'btn sm', type: 'button', text: 'Edit', onclick: function () { openEdit(c); } }), el('button', { class: 'btn go sm', type: 'button', text: 'Log', onclick: function () { openLog(c); } })])
      ])]));
      var w = el('div', { class: 'wrap' }); d.appendChild(w);
      w.appendChild(el('div', { style: 'padding:16px 0 4px' }, [
        el('div', { style: 'font-size:22px;font-weight:700;letter-spacing:-.01em', text: c.name }),
        el('div', { class: 'meta', style: 'margin-top:2px', text: [c.title, c.org].filter(Boolean).join(', ') || ' ' }),
        el('div', { style: 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap' }, [el('span', { class: 'pill', text: c.group }), el('span', { class: 'pill', text: c.stage }), c.prio === 1 ? el('span', { class: 'pill p1', text: 'Top' }) : null, c.state === 'done' ? el('span', { class: 'pill', text: 'done' }) : null])
      ]));
      var acts = el('div', { class: 'row' });
      if (c.phone) { acts.appendChild(el('a', { class: 'btn', href: 'tel:' + digits(c.phone), text: 'Call', style: 'text-decoration:none;color:inherit' })); acts.appendChild(el('a', { class: 'btn', href: 'sms:' + digits(c.phone), text: 'Text', style: 'text-decoration:none;color:inherit' })); }
      if (c.email) acts.appendChild(el('a', { class: 'btn', href: 'mailto:' + c.email, text: 'Email', style: 'text-decoration:none;color:inherit' }));
      if (c.linkedin && /^https:\/\//i.test(c.linkedin)) acts.appendChild(el('a', { class: 'btn', href: c.linkedin, target: '_blank', rel: 'noopener', text: 'LinkedIn', style: 'text-decoration:none;color:inherit' }));
      if (acts.children.length) w.appendChild(acts);

      w.appendChild(el('h2', { text: 'Next step' }));
      var due = dueWords(c);
      var nx = el('div', { class: 'card' + (due && due.cls === 'late' ? ' over' : '') }, [
        el('div', { class: 'next', style: 'margin-top:0', text: c.next || 'No next step written.' }),
        el('div', { class: 'meta' }, [due ? el('span', { class: due.cls, text: 'Follow up: ' + due.text }) : el('span', { text: c.state === 'done' ? 'Done. No follow-up.' : 'No follow-up date.' })])
      ]);
      if (c.due) nx.appendChild(el('div', { class: 'row' }, [el('a', { class: 'btn sm', href: '/api/admin/crm/contacts/' + encodeURIComponent(c.id) + '/followup.ics', text: 'Add to calendar', style: 'text-decoration:none;color:inherit' })]));
      w.appendChild(nx);

      if (c.say) {
        w.appendChild(el('h2', { text: 'What to say' }));
        var copy = el('button', { class: 'btn sm', type: 'button', text: 'Copy' });
        copy.addEventListener('click', function () {
          var done = function () { copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy'; }, 1500); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.say).then(done, function () { toast('Select the text and copy it.'); });
          else toast('Select the text and copy it.');
        });
        w.appendChild(el('div', { class: 'say', text: c.say }));
        w.appendChild(el('div', { class: 'row' }, [copy]));
      }
      var kv = el('div', { class: 'kv' });
      [['Phone', c.phone], ['Email', c.email], ['Worth', c.value != null ? '$' + Number(c.value).toLocaleString() + ' a month' : null], ['Source', c.source], ['Last touch', c.lastTouchAt ? ago(c.lastTouchAt) : null]].forEach(function (r) {
        if (!r[1]) return; kv.appendChild(el('div', { class: 'k', text: r[0] })); kv.appendChild(el('div', { class: 'v', text: String(r[1]) }));
      });
      if (kv.children.length) { w.appendChild(el('h2', { text: 'Details' })); w.appendChild(el('div', { class: 'card' }, [kv])); }
      if (c.notes) { w.appendChild(el('h2', { text: 'Notes' })); w.appendChild(el('div', { class: 'card', style: 'white-space:pre-wrap;font-size:15px', text: c.notes })); }

      w.appendChild(el('h2', null, ['History ', el('span', { class: 'n', text: String((c.activity || []).length) })]));
      if (!(c.activity || []).length) w.appendChild(el('div', { class: 'meta', text: 'Nothing logged yet. Tap Log after a call or a text.' }));
      var tl = el('div', { class: 'tl' });
      (c.activity || []).forEach(function (a) {
        var it = el('div', { class: 'it' + (a.type === 'inbound' ? ' in' : '') }, [el('div', { text: a.text }), el('div', { class: 'when', text: stamp(a.at) + '  ·  ' + a.type })]);
        var rm = el('button', { class: 'x', type: 'button', text: 'Remove' });
        rm.addEventListener('click', function () {
          if (rm.dataset.sure !== '1') { rm.dataset.sure = '1'; rm.textContent = 'Tap again to remove'; return; }
          api('DELETE', '/contacts/' + encodeURIComponent(c.id) + '/activity/' + a.id).then(function () { openDetail(c.id); load(); });
        });
        it.appendChild(rm); tl.appendChild(it);
      });
      w.appendChild(tl);
      var arch = el('button', { class: 'btn ghost sm', type: 'button', text: 'Archive this contact', style: 'margin:22px 0' });
      arch.addEventListener('click', function () {
        if (arch.dataset.sure !== '1') { arch.dataset.sure = '1'; arch.textContent = 'Tap again to archive'; return; }
        api('PATCH', '/contacts/' + encodeURIComponent(c.id), { archived: true }).then(function () { closeDetail(); toast('Archived'); load(); });
      });
      w.appendChild(arch);
    }).catch(function (e) { if (e.message !== 'signed out') { d.textContent = ''; d.appendChild(el('div', { class: 'wrap empty' }, [el('div', { text: e.message }), el('button', { class: 'btn', type: 'button', text: 'Back', style: 'margin-top:12px', onclick: closeDetail })])); } });
  }
  function closeDetail() { S.open = null; $('detail').classList.remove('open'); try { history.replaceState(null, '', location.pathname); } catch (_) {} }

  // ── tabs, search, load ──
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function (x) { x.classList.toggle('on', x === b); });
      Array.prototype.forEach.call(document.querySelectorAll('.page'), function (pg) { pg.classList.toggle('on', pg.id === 'pg-' + b.dataset.tab); });
      window.scrollTo(0, 0);
    });
  });
  $('q').addEventListener('input', function () { S.q = $('q').value; renderContacts(); });
  function load() {
    return Promise.all([api('GET', '/today'), api('GET', '/contacts')]).then(function (r) {
      S.today = r[0]; S.contacts = r[1].contacts || [];
      renderToday(); renderContacts();
    });
  }
  api('GET', '/meta').then(function (m) {
    S.meta = m; renderFilters(); renderMore();
    return load();
  }).then(function () {
    var m = /#c=([^&]+)/.exec(location.hash); if (m) openDetail(decodeURIComponent(m[1]));
  }).catch(function (e) { if (e.message !== 'signed out') { $('hdSub').textContent = 'Could not load'; $('pg-today').appendChild(el('div', { class: 'empty', text: e.message })); } });
  // Coming back to the app after a call: show what is due now.
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.meta && !$('sheet').classList.contains('open')) load().catch(function () {}); });
})();
</script>
</body>
</html>
