<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Player profile</title>
<style>
:root { --bg:#f5f7f4; --fg:#15201a; --muted:#4a574f; --line:#dde4dd; --card:#fff; --acc:#1b7a48; --soft:#e5f2ea; }
@media (prefers-color-scheme: dark) { :root { --bg:#101511; --fg:#e7ede8; --muted:#9aa99f; --line:#2a332d; --card:#18201b; --acc:#4cc283; --soft:#1d3a29; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; display: flex; flex-direction: column; gap: 16px; }
a { color: var(--acc); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.pos { font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.1; }
.sub { color: var(--muted); margin: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.fact { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.fact .k { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fact .v { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
.stats { font-size: 1.05rem; font-weight: 600; margin: 0; }
ul { margin: 0; padding-left: 20px; }
li { margin: 4px 0; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border-radius: 9px; background: var(--acc); color: #fff; font-weight: 700; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line); }
h2 { margin: 0; font-size: 1rem; }
.agent { display: flex; flex-direction: column; gap: 4px; }
.fine { font-size: .8rem; color: var(--muted); margin: 0; }
.err { text-align: center; color: var(--muted); padding: 60px 0; }
@media print { body { background: #fff; } .btns { display: none; } .card { border: 0; padding: 0; } }
</style>
</head>
<body>
<main id="root"><p class="err">Loading...</p></main>
<script>
(function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => /^https?:\/\//i.test(String(u || '')) ? String(u) : null;
  const token = location.pathname.split('/').filter(Boolean).pop();
  fetch('/api/portal-profile/' + encodeURIComponent(token)).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((p) => {
    document.title = (p.name || 'Player') + (p.position ? ', ' + p.position : '');
    const facts = [
      ['Size', p.heightWeight], ['Class', p.classYear],
      ['Seasons left', p.seasonsLeft != null ? String(p.seasonsLeft) : null], ['Hometown', p.hometown],
    ].filter((f) => f[1]);
    const film = safeUrl(p.filmUrl), stats = safeUrl(p.statsUrl);
    const contact = [p.agent.phone ? `<a href="tel:${esc(String(p.agent.phone).replace(/[^0-9+]/g, ''))}">${esc(p.agent.phone)}</a>` : '', p.agent.email ? `<a href="mailto:${esc(p.agent.email)}">${esc(p.agent.email)}</a>` : ''].filter(Boolean).join(' · ');
    document.getElementById('root').innerHTML = `
      <section class="card">
        <div class="pos">${esc(p.position || '')}${p.position ? ' · ' : ''}Transfer portal</div>
        <h1>${esc(p.name || 'Player')}</h1>
        ${p.school ? `<p class="sub">${esc(p.school)}</p>` : ''}
        ${facts.length ? `<div class="facts">${facts.map((f) => `<div class="fact"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])}</div></div>`).join('')}</div>` : ''}
        ${p.statsLine ? `<p class="stats">${esc(p.statsLine)}</p>` : ''}
        ${p.highlights && p.highlights.length ? `<ul>${p.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
        ${p.note ? `<p class="sub">${esc(p.note)}</p>` : ''}
        ${film || stats ? `<div class="btns">${film ? `<a class="btn" href="${esc(film)}" target="_blank" rel="noopener">Watch film</a>` : ''}${stats ? `<a class="btn ghost" href="${esc(stats)}" target="_blank" rel="noopener">Full stats</a>` : ''}</div>` : ''}
      </section>
      <section class="card">
        <h2>Contact his agent</h2>
        <div class="agent"><b>${esc(p.agent.name || 'His agent')}</b>${contact ? `<span>${contact}</span>` : ''}</div>
      </section>
      <p class="fine">Shared by his agent through NILDash.</p>`;
  }).catch(() => { document.getElementById('root').innerHTML = '<p class="err">This page is not available.</p>'; });
})();
</script>
</body>
</html>
