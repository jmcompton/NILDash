<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospector</title>
<style>
:root { --bg:#f7f7f5; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --high:#b91c1c; --high-bg:#fee2e2; --med:#92400e; --med-bg:#fef3c7; --ok:#166534; --ok-bg:#dcfce7; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e5e7eb; --muted:#9ca3af; --line:#2a2f3a; --accent:#93c5fd; --high:#fca5a5; --high-bg:#3b1414; --med:#fcd34d; --med-bg:#3a2a0a; --ok:#86efac; --ok-bg:#0f2a19; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }
main { max-width:1080px; margin:0 auto; padding:28px 16px 64px; }
h1 { font-size:24px; margin:0 0 4px; }
.sub { color:var(--muted); margin:0 0 24px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
form { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }
label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); font-weight:600; }
input, select, textarea { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
textarea { resize:vertical; min-height:42px; }
.wide { grid-column:1 / -1; }
button { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
@media (prefers-color-scheme: dark) { button { color:#0f1115; } }
button[disabled] { opacity:.5; cursor:wait; }
.hint { font-size:13px; color:var(--muted); }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin:4px 0 16px; }
.tile { border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.tile b { display:block; font-size:24px; }
.tile span { font-size:13px; color:var(--muted); }
.lead { border-top:1px solid var(--line); padding:14px 0; }
.lead:first-child { border-top:0; }
.row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; }
.biz { font-weight:700; }
.muted { color:var(--muted); font-size:13px; }
.pill { font-size:12px; font-weight:700; border-radius:999px; padding:2px 9px; }
.high { color:var(--high); background:var(--high-bg); }
.medium { color:var(--med); background:var(--med-bg); }
.ver { color:var(--ok); background:var(--ok-bg); }
.unver { color:var(--muted); border:1px solid var(--line); }
.problem { margin:6px 0 0; }
details { margin-top:8px; }
summary { cursor:pointer; color:var(--accent); font-size:14px; font-weight:600; }
pre { white-space:pre-wrap; font:14px/1.55 inherit; font-family:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; margin:8px 0 0; }
.runs a { color:var(--accent); text-decoration:none; }
.runs li { margin:4px 0; }
.status { margin:8px 0 0; font-size:14px; color:var(--muted); }
.err { color:var(--high); }
</style>
</head>
<body>
<main>
  <h1>Prospector</h1>
  <p class="sub">Pick a market and an area. It finds local businesses, checks each one, finds and verifies the decision maker, and writes the first email.</p>

  <section class="card">
    <form id="f">
      <label>Market
        <select name="playbook" id="playbook"></select>
      </label>
      <label>Area
        <input name="area" value="Birmingham, AL" required>
      </label>
      <label>Opportunities to build
        <select name="limit"><option>5</option><option selected>10</option><option>15</option><option>25</option></select>
      </label>
      <label>Sender name
        <input name="name" value="JohnMark Compton">
      </label>
      <label>Sender company
        <input name="company" placeholder="e.g. Magic City IT">
      </label>
      <label class="wide">About the sender (optional, helps the email)
        <textarea name="about" placeholder="e.g. 12-person IT company in Hoover, focused on medical and dental offices"></textarea>
      </label>
      <div class="wide row">
        <button id="go" type="submit">Run</button>
        <span class="hint">Checking every business is free. Hunter credits are spent only on the opportunities built: about 1.5 each.</span>
      </div>
    </form>
    <p class="status" id="status"></p>
  </section>

  <section class="card" id="result" hidden>
    <div class="row"><h2 style="margin:0;font-size:18px" id="rtitle"></h2></div>
    <div class="tiles" id="tiles"></div>
    <div id="leads"></div>
  </section>

  <section class="card runs">
    <h2 style="margin:0 0 8px;font-size:16px">Recent runs</h2>
    <ul id="runs" style="margin:0;padding-left:18px"></ul>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const j = async (url, opts) => { const r = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {})); const b = await r.json().catch(() => ({})); if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status)); return b; };
  let timer = null;

  async function loadPlaybooks() {
    const b = await j('/api/lab/prospector/playbooks');
    $('playbook').innerHTML = b.playbooks.map((p) => `<option value="${esc(p.key)}" ${p.ready ? '' : 'disabled'}>${esc(p.label)}${p.ready ? '' : ' (coming)'}</option>`).join('');
  }
  async function loadRuns() {
    const b = await j('/api/lab/prospector/runs');
    $('runs').innerHTML = b.runs.length ? b.runs.map((r) => {
      const s = r.summary || {};
      return `<li><a href="#${r.id}" data-id="${r.id}">#${r.id} ${esc(r.area)}</a> <span class="muted">${esc(r.status)}${s.checked ? ` · ${s.withGap} of ${s.checked} with a gap · ${s.verified || 0} verified` : ''} · ${new Date(r.created_at).toLocaleString()}</span></li>`;
    }).join('') : '<li class="muted">None yet.</li>';
  }

  function tile(n, label) { return `<div class="tile"><b>${n == null ? '-' : n}</b><span>${esc(label)}</span></div>`; }

  function render(data) {
    const run = data.run, s = run.summary || {};
    $('result').hidden = false;
    $('rtitle').textContent = `#${run.id} · ${run.area} · ${run.status === 'running' ? 'running...' : run.status}`;
    $('tiles').innerHTML = [
      tile(s.checked, 'businesses checked'),
      tile(s.withGap, 'have an email security gap'),
      tile(s.high, 'high risk'),
      tile(s.reachable != null ? s.reachable : s.people, 'have an address to write to'),
      tile(s.people, 'named decision makers'),
      tile(s.verified, 'verified addresses'),
      tile(s.written, 'emails written'),
    ].join('') + (s.skipped ? `<p class="muted">Skipped ${s.skipped} that are not a fit: ${esc(Object.entries(s.skippedWhy || {}).map(([k, n]) => n + ' ' + k).join(', '))}.</p>` : '') + (run.error ? `<p class="err">${esc(run.error)}</p>` : '') + ((s.placesErrors || []).length ? `<p class="err">${esc(s.placesErrors[0])}</p>` : '');
    $('leads').innerHTML = (data.leads || []).map((l) => {
      const f = l.finding || {}, p = l.person, e = l.email || {};
      return `<div class="lead">
        <div class="row"><span class="biz">${esc(l.business)}</span><span class="pill ${esc(l.level)}">${l.level === 'high' ? 'High risk' : 'Medium risk'}</span>
          <span class="muted">${esc(l.category)} · ${esc(l.domain)}${f.mail ? ' · ' + esc(f.mail) : ''}${l.phone ? ' · ' + esc(l.phone) : ''}</span></div>
        <p class="problem">${esc((f.problems || [])[0])}</p>
        <div class="row" style="margin-top:6px">${p ? `<span>${p.first ? `<b>${esc(p.first)} ${esc(p.last)}</b>${p.title ? ', ' + esc(p.title) : ''}` : `<b>${esc(p.title || 'Published address')}</b>${p.owner ? ' <span class="muted">(owner: ' + esc(p.owner) + ')</span>' : ''}`}${p.source ? ' <span class="muted">via ' + esc(p.source) + '</span>' : ''}</span><span>${esc(p.email)}</span><span class="pill ${l.verified ? 'ver' : 'unver'}">${l.verified ? 'Verified' : esc(l.verify_status || 'not verified')}</span>` : `<span class="muted">No named person found (${esc(l.verify_status || '')})</span>`}</div>
        <details><summary>The email${e.source === 'template' ? ' (template)' : ''}</summary><pre><b>${esc(e.subject)}</b>\n\n${esc(e.body)}</pre></details>
      </div>`;
    }).join('') || (run.status === 'running' ? '<p class="muted">Working: finding businesses and checking each one. This takes a minute or two.</p>' : '<p class="muted">No opportunities in this run.</p>');
  }

  async function show(id) {
    clearTimeout(timer);
    const data = await j('/api/lab/prospector/runs/' + id);
    render(data);
    if (data.run.status === 'running') timer = setTimeout(() => show(id), 4000);
    else { loadRuns(); $('go').disabled = false; $('status').textContent = ''; }
  }

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    $('go').disabled = true; $('status').textContent = 'Starting...';
    try {
      const b = await j('/api/lab/prospector/run', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playbook: fd.get('playbook'), area: fd.get('area'), limit: fd.get('limit'),
          sender: { name: fd.get('name'), company: fd.get('company'), about: fd.get('about') } }) });
      location.hash = b.runId; $('status').textContent = 'Running. Results fill in below.';
      show(b.runId);
    } catch (e) { $('status').innerHTML = `<span class="err">${esc(e.message)}</span>`; $('go').disabled = false; }
  });
  $('runs').addEventListener('click', (ev) => { const a = ev.target.closest('a[data-id]'); if (a) { ev.preventDefault(); location.hash = a.dataset.id; show(a.dataset.id); } });

  loadPlaybooks().catch((e) => { $('status').innerHTML = `<span class="err">${esc(e.message)}</span>`; });
  loadRuns().catch(() => {});
  if (/^#\d+$/.test(location.hash)) show(location.hash.slice(1)).catch(() => {});
})();
</script>
</body>
</html>
